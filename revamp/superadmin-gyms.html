<!DOCTYPE html>
<!-- @dsCard group="Brand" name="GymFlow Revamp — Superadmin Gyms" subtitle="Platform · Gyms — searchable list, filters, gym drawer" viewport="1280x900" -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GymFlow — Gyms</title>
<link rel="stylesheet" href="revamp.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .sb-role { display:flex; align-items:center; gap:10px; margin-top:14px; padding:8px; border-radius:var(--gf-radius-sm); background:var(--gf-elevated); border:1px solid var(--gf-border); }
  .sb-role .gf-avatar { background:var(--gf-info-soft); color:var(--gf-info); border-color:rgba(64,128,255,0.25); }
  .sb-role small { color:var(--gf-text-muted); font-size:0.66rem; display:block; }
  .sb-role strong { font-family:var(--gf-font-display); font-size:0.85rem; }
  .page-h { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .page-h h1 { font-family:var(--gf-font-display); font-size:clamp(1.5rem,2.4vw,2rem); font-weight:800; letter-spacing:-0.03em; margin:0; }
  .page-h p { margin:5px 0 0; color:var(--gf-text-secondary); font-size:0.9rem; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
  .kpi { background:var(--gf-surface); border:1px solid var(--gf-border); border-radius:var(--gf-radius); padding:18px; }
  .kpi-ic { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; margin-bottom:12px; }
  .kpi-ic i { width:19px; height:19px; }
  .kpi-val { font-family:var(--gf-font-display); font-size:2rem; font-weight:800; letter-spacing:-0.03em; line-height:1; }
  .kpi-lbl { color:var(--gf-text-muted); font-size:0.8125rem; margin-top:6px; }
  .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar .search { flex:1; min-width:220px; max-width:360px; }
  table.gt { width:100%; border-collapse:collapse; }
  .gt th { text-align:left; font-family:var(--gf-font-display); font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--gf-text-muted); padding:0 14px 12px; }
  .gt td { padding:12px 14px; border-top:1px solid var(--gf-border); font-size:0.875rem; }
  .gt tbody tr { transition:background var(--gf-t); cursor:pointer; }
  .gt tbody tr:hover { background:var(--gf-elevated); }
  .gname { display:flex; align-items:center; gap:11px; }
  .gname .sq { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-family:var(--gf-font-display); font-weight:800; font-size:0.85rem; color:#fff; }
  .gname strong { font-family:var(--gf-font-display); font-weight:600; display:block; font-size:0.875rem; }
  .gname small { color:var(--gf-text-muted); font-size:0.72rem; }
  .naira { font-variant-numeric:tabular-nums; font-weight:600; font-family:var(--gf-font-display); }
  .drawer-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity var(--gf-t); z-index:300; }
  .drawer-bg.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--gf-surface); border-left:1px solid var(--gf-border); box-shadow:var(--gf-shadow-lg); transform:translateX(100%); transition:transform var(--gf-t-slow); z-index:310; overflow-y:auto; }
  .drawer.open { transform:translateX(0); }
  .drawer-h { display:flex; align-items:center; justify-content:space-between; padding:20px; border-bottom:1px solid var(--gf-border); }
  .drawer-b { padding:20px; }
  .dstat { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .dstat .l { color:var(--gf-text-muted); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
  .dstat .v { font-family:var(--gf-font-display); font-weight:700; margin-top:4px; }
  @media (max-width:1100px){ .kpis{grid-template-columns:1fr 1fr} }
</style>
</head>
<body data-gf-mobile="superadmin-mobile.html">
<div class="app">
  <aside class="gf-sidebar" id="saSidebar"></aside>

  <div class="main">
    <header class="top" id="saTop"></header>

    <main class="content">
      <div class="page-h"><div><h1>Gyms</h1><p>1,204 gyms · 38 on trial · 6 past due</p></div>
        <div class="seg" style="display:inline-flex;background:var(--gf-elevated);border:1px solid var(--gf-border);border-radius:var(--gf-radius-pill);padding:3px;gap:2px"></div>
      </div>

      <section class="kpis">
        <div class="kpi"><div class="kpi-ic" style="background:#11d18b1f;color:#11d18b"><i data-lucide="building-2"></i></div><div class="kpi-val">1,204</div><div class="kpi-lbl">Total gyms</div></div>
        <div class="kpi"><div class="kpi-ic" style="background:#00c8961f;color:#00c896"><i data-lucide="check-circle-2"></i></div><div class="kpi-val">1,160</div><div class="kpi-lbl">Active</div></div>
        <div class="kpi"><div class="kpi-ic" style="background:#ffb0201f;color:#ffb020"><i data-lucide="clock"></i></div><div class="kpi-val">38</div><div class="kpi-lbl">On trial</div></div>
        <div class="kpi"><div class="kpi-ic" style="background:#ff45601f;color:#ff4560"><i data-lucide="alert-triangle"></i></div><div class="kpi-val">6</div><div class="kpi-lbl">Past due</div></div>
      </section>

      <div class="panel">
        <div class="toolbar">
          <div class="search"><i data-lucide="search"></i><input id="q2" placeholder="Filter gyms…" /></div>
          <div style="flex:1"></div>
          <div class="chips" id="chips" style="display:flex;gap:8px"><span class="gf-chip active" data-f="all">All</span><span class="gf-chip" data-f="Active">Active</span><span class="gf-chip" data-f="Trial">Trial</span><span class="gf-chip" data-f="Past due">Past due</span></div>
        </div>
        <table class="gt">
          <thead><tr><th>Gym</th><th>Plan</th><th>Members</th><th>Status</th><th style="text-align:right">MRR</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="drawer-bg" id="dbg"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <div style="display:flex;align-items:center;gap:12px"><span id="dSq" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--gf-font-display);font-weight:800;color:#fff">P</span><div><div id="dName" style="font-family:var(--gf-font-display);font-weight:800;font-size:1.1rem">Powerhouse</div><div id="dSub" style="color:var(--gf-text-muted);font-size:0.78rem">powerhouse.gymflow.ng</div></div></div>
    <button class="icon-btn" id="dClose"><i data-lucide="x"></i></button>
  </div>
  <div class="drawer-b">
    <div id="dStatus" style="margin-bottom:18px"></div>
    <div class="panel" style="padding:16px;margin-bottom:14px"><div class="dstat">
      <div><div class="l">Plan</div><div class="v" id="dPlan">Scale</div></div>
      <div><div class="l">Members</div><div class="v" id="dMembers">482</div></div>
      <div><div class="l">MRR</div><div class="v naira" id="dMrr">₦119,999</div></div>
      <div><div class="l">Joined</div><div class="v">Feb 2024</div></div>
    </div></div>
    <div style="display:flex;gap:10px;margin-top:8px"><button class="gf-btn gf-btn-primary gf-btn-full"><i data-lucide="external-link" style="width:16px;height:16px"></i> Open dashboard</button><button class="gf-btn gf-btn-secondary"><i data-lucide="pause" style="width:16px;height:16px"></i></button></div>
  </div>
</aside>

<nav class="proto" id="proto"></nav>
<script src="proto.js"></script>
<script src="theme.js"></script>
<script src="wire.js"></script>
<script src="superadmin-shell.js"></script>
<script>
saShell('gyms', { search:'Search gyms, owners, subdomains…', action:{label:'Onboard a gym', icon:'user-plus', href:'superadmin-onboard.html'} });
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const GYMS=[
  ['Powerhouse Fitness','powerhouse.gymflow.ng · Lagos','P','#11d18b','#07a86c','Scale','482','Active','₦119,999'],
  ['FlexZone','flexzone.gymflow.ng · Abuja','F','#4080ff','#2a5cc0','Growth','318','Active','₦37,999'],
  ['IronWorks Gym','ironworks.gymflow.ng · PH','I','#a8d92e','#6a9c00','Scale','540','Active','₦119,999'],
  ['FitHub Enugu','fithub.gymflow.ng · Enugu','F','#ffb020','#cc8a10','Growth','206','Past due','₦37,999'],
  ['Peak Fitness','peak.gymflow.ng · Kaduna','P','#b67bf3','#7c45c0','Starter','74','Trial','₦13,999'],
  ['Apex Strength','apex.gymflow.ng · Ibadan','A','#11d18b','#07a86c','Growth','264','Active','₦37,999'],
  ['Titan Gym','titan.gymflow.ng · Lagos','T','#4080ff','#2a5cc0','Scale','611','Active','₦119,999'],
  ['Pulse Studio','pulse.gymflow.ng · Abuja','P','#ff4560','#cc2233','Starter','58','Trial','₦13,999'],
  ['Forge Fitness','forge.gymflow.ng · Jos','F','#a8d92e','#6a9c00','Growth','188','Active','₦37,999'],
  ['Momentum Gym','momentum.gymflow.ng · Benin','M','#b67bf3','#7c45c0','Starter','42','Past due','₦13,999'],
];
const STMAP={'Active':'gf-badge-success','Past due':'gf-badge-danger','Trial':'gf-badge-warning'};
let filter='all', query='';
function render(){
  const rows=GYMS.filter(g=>(filter==='all'||g[7]===filter)&&(g[0].toLowerCase().includes(query)||g[1].toLowerCase().includes(query)));
  $('#rows').innerHTML=rows.map((g,idx)=>`<tr data-i="${GYMS.indexOf(g)}">
    <td><div class="gname"><span class="sq" style="background:linear-gradient(135deg,${g[3]},${g[4]})">${g[2]}</span><div><strong>${g[0]}</strong><small>${g[1]}</small></div></div></td>
    <td>${g[5]}</td><td>${g[6]}</td>
    <td><span class="gf-badge ${STMAP[g[7]]}"><span class="gf-dot"></span>${g[7]}</span></td>
    <td style="text-align:right" class="naira">${g[8]}</td></tr>`).join('')||`<tr><td colspan="5" style="text-align:center;color:var(--gf-text-muted);padding:28px">No gyms match.</td></tr>`;
  lucide.createIcons();
  $$('#rows tr[data-i]').forEach(tr=>tr.onclick=()=>openGym(GYMS[+tr.dataset.i]));
}
function openGym(g){
  $('#dName').textContent=g[0]; $('#dSub').textContent=g[1];
  const sq=$('#dSq'); sq.style.background=`linear-gradient(135deg,${g[3]},${g[4]})`; sq.textContent=g[2];
  $('#dPlan').textContent=g[5]; $('#dMembers').textContent=g[6]; $('#dMrr').textContent=g[8];
  $('#dStatus').innerHTML=`<span class="gf-badge ${STMAP[g[7]]}" style="padding:6px 12px"><span class="gf-dot"></span>${g[7]}</span>`;
  $('#drawer').classList.add('open'); $('#dbg').classList.add('open'); lucide.createIcons();
}
const close=()=>{ $('#drawer').classList.remove('open'); $('#dbg').classList.remove('open'); };
$('#dClose').onclick=$('#dbg').onclick=close;
$$('#chips .gf-chip').forEach(c=>c.onclick=()=>{ $$('#chips .gf-chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); filter=c.dataset.f; render(); });
$('#q2').oninput=e=>{ query=e.target.value.toLowerCase().trim(); render(); };
buildProto('superadmin'); render(); lucide.createIcons();
</script>
</body>
</html>
