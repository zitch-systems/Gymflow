<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GymFlow — Earnings</title>
<link rel="stylesheet" href="admin.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .grid2 { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }
  .ec { display:flex; align-items:flex-end; gap:9px; height:170px; padding-top:8px; }
  .ec .col { flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; height:100%; justify-content:flex-end; }
  .ec .bar { width:100%; max-width:34px; border-radius:7px 7px 3px 3px; background:linear-gradient(180deg,var(--gf-brand-light),var(--gf-brand-dark)); }
  .ec .lbl { font-size:0.68rem; color:var(--gf-text-muted); font-weight:600; }
  .brk { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--gf-border); }
  .brk:first-child { border-top:none; }
  .brk .ic { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex-shrink:0; }
  .brk .ic i { width:18px; height:18px; }
  .brk .m { flex:1; min-width:0; }
  .brk .m strong { font-family:var(--gf-font-display); font-size:0.88rem; display:block; }
  .brk .m small { color:var(--gf-text-muted); font-size:0.74rem; }
  .brk .v { font-family:var(--gf-font-display); font-weight:800; }
  @media (max-width:1000px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body data-gf-mobile="instructor-mobile.html">
<div class="app">
  <aside class="gf-sidebar" id="coachSidebar"></aside>
  <div class="main">
    <header class="top" id="coachTop"></header>
    <main class="content">
      <div class="page-h"><div><h1>Earnings</h1><p>May · ₦168,000 earned · next payout 2 Jun</p></div></div>
      <section class="kpis">
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#11d18b1f;color:#11d18b"><i data-lucide="wallet"></i></div></div><div class="kpi-val">₦168K</div><div class="kpi-lbl">This month</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#4080ff1f;color:#4080ff"><i data-lucide="calendar-check"></i></div></div><div class="kpi-val">42</div><div class="kpi-lbl">Sessions paid</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#c6f24e1f;color:#a8d92e"><i data-lucide="trending-up"></i></div></div><div class="kpi-val">+9%</div><div class="kpi-lbl">vs last month</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#ffb0201f;color:#ffb020"><i data-lucide="hourglass"></i></div></div><div class="kpi-val">₦42K</div><div class="kpi-lbl">Pending payout</div></div>
      </section>
      <div class="grid2">
        <div class="panel">
          <div class="panel-h"><div><h3>Earnings trend</h3><div class="sub">Last 6 weeks</div></div></div>
          <div class="ec">
            <div class="col"><div class="bar" style="height:50%"></div><div class="lbl">W1</div></div>
            <div class="col"><div class="bar" style="height:64%"></div><div class="lbl">W2</div></div>
            <div class="col"><div class="bar" style="height:58%"></div><div class="lbl">W3</div></div>
            <div class="col"><div class="bar" style="height:78%"></div><div class="lbl">W4</div></div>
            <div class="col"><div class="bar" style="height:70%"></div><div class="lbl">W5</div></div>
            <div class="col"><div class="bar" style="height:92%"></div><div class="lbl">W6</div></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><div><h3>Breakdown</h3><div class="sub">By source · May</div></div></div>
          <div class="brk"><div class="ic" style="background:var(--gf-brand-soft);color:var(--gf-brand)"><i data-lucide="calendar-days"></i></div><div class="m"><strong>Group classes</strong><small>28 sessions</small></div><span class="v">₦98K</span></div>
          <div class="brk"><div class="ic" style="background:#4080ff1f;color:#4080ff"><i data-lucide="dumbbell"></i></div><div class="m"><strong>PT sessions</strong><small>14 sessions</small></div><span class="v">₦56K</span></div>
          <div class="brk"><div class="ic" style="background:#c6f24e1f;color:#a8d92e"><i data-lucide="award"></i></div><div class="m"><strong>Retention bonus</strong><small>96% retention</small></div><span class="v">₦14K</span></div>
        </div>
      </div>
    </main>
  </div>
</div>
<nav class="proto" id="proto"></nav>
<script src="proto.js"></script><script src="theme.js"></script><script src="wire.js"></script><script src="instructor-shell.js"></script>
<script>coachShell('earnings',{search:'Search…',action:{label:'Statement',icon:'download',href:'#'}}); buildProto('instructor'); lucide.createIcons();</script>
</body>
</html>
