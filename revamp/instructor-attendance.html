<!DOCTYPE html>
<!-- @dsCard group="Brand" name="GymFlow Revamp — Coach Attendance" subtitle="Coach · Attendance — mark check-ins per class" viewport="1280x820" -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GymFlow — Attendance</title>
<link rel="stylesheet" href="admin.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .grid2 { display:grid; grid-template-columns:1fr 320px; gap:16px; align-items:start; }
  .ar { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--gf-border); }
  .ar:first-child { border-top:none; }
  .ar .gf-avatar { background:var(--gf-brand-soft); color:var(--gf-brand); border-color:var(--gf-brand-glow); font-size:0.76rem; }
  .ar .m { flex:1; min-width:0; }
  .ar .m strong { font-family:var(--gf-font-display); font-size:0.86rem; font-weight:600; display:block; }
  .ar .m small { color:var(--gf-text-muted); font-size:0.72rem; }
  .cls-pick { display:flex; flex-direction:column; gap:8px; }
  .cp { display:flex; align-items:center; gap:11px; padding:12px; border:1px solid var(--gf-border); border-radius:var(--gf-radius-sm); background:var(--gf-elevated); cursor:pointer; transition:all var(--gf-t); }
  .cp.on { border-color:var(--gf-brand); background:var(--gf-brand-soft); }
  .cp b { font-family:var(--gf-font-display); font-weight:700; color:var(--gf-brand); width:48px; }
  .cp .m { flex:1; min-width:0; }
  .cp .m strong { font-family:var(--gf-font-display); font-size:0.84rem; display:block; }
  .cp .m small { color:var(--gf-text-muted); font-size:0.72rem; }
  @media (max-width:1000px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body data-gf-mobile="instructor-mobile.html">
<div class="app">
  <aside class="gf-sidebar" id="coachSidebar"></aside>
  <div class="main">
    <header class="top" id="coachTop"></header>
    <main class="content">
      <div class="page-h"><div><h1>Attendance</h1><p>Thursday, 30 May · mark who showed up</p></div></div>
      <div class="grid2">
        <div class="panel">
          <div class="panel-h"><div><h3 id="rTitle">Power Lifting · 09:00</h3><div class="sub"><span id="inCt">8</span> checked in · <span id="penCt">4</span> pending</div></div>
            <button class="gf-btn gf-btn-sm gf-btn-primary" id="markAll"><i data-lucide="check-check" style="width:14px;height:14px"></i> Mark all in</button>
          </div>
          <div id="roster"></div>
        </div>
        <div class="panel">
          <div class="panel-h"><div><h3>Today's classes</h3></div></div>
          <div class="cls-pick" id="clsPick"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"><i data-lucide="check-circle-2"></i><span id="toastMsg">Done</span></div>
<nav class="proto" id="proto"></nav>
<script src="proto.js"></script><script src="theme.js"></script><script src="wire.js"></script><script src="instructor-shell.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const CLASSES=[['06:30','Sunrise HIIT','Studio A'],['09:00','Power Lifting','Weights floor'],['17:30','Conditioning','Studio B']];
const NAMES=[['Tunde Adeyemi','T',1],['Ngozi Eze','N',1],['Kelechi Obi','K',1],['Emeka Nwosu','E',1],['Grace Udo','G',1],['Aisha Bello','A',1],['David Okon','D',1],['Musa Ibrahim','M',1],['Chidi Okeke','C',0],['Bola Ade','B',0],['Sade Koya','S',0],['Ifeoma N.','I',0]];
let roster=NAMES.map(n=>[...n]); let pick=1;
function counts(){ const ins=roster.filter(r=>r[2]).length; $('#inCt').textContent=ins; $('#penCt').textContent=roster.length-ins; }
function renderRoster(){ $('#roster').innerHTML=roster.map((r,idx)=>`<div class="ar"><span class="gf-avatar gf-avatar-sm">${r[1]}</span><div class="m"><strong>${r[0]}</strong><small>${r[2]?'Checked in':'Booked · not in'}</small></div><button class="gf-btn gf-btn-sm ${r[2]?'gf-btn-secondary':'gf-btn-primary'}" data-i="${idx}">${r[2]?'Undo':'Mark in'}</button></div>`).join(''); $$('#roster button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;roster[i][2]=roster[i][2]?0:1;renderRoster();counts();}); lucide.createIcons(); }
function renderPick(){ $('#clsPick').innerHTML=CLASSES.map((c,i)=>`<div class="cp ${i===pick?'on':''}" data-i="${i}"><b>${c[0]}</b><div class="m"><strong>${c[1]}</strong><small>${c[2]}</small></div></div>`).join(''); $$('.cp').forEach(x=>x.onclick=()=>{pick=+x.dataset.i;$('#rTitle').textContent=CLASSES[pick][1]+' · '+CLASSES[pick][0];renderPick();}); }
$('#markAll').onclick=()=>{ roster.forEach(r=>r[2]=1); renderRoster(); counts(); gfToast('All marked in'); };
coachShell('attendance',{search:'Search members…'}); buildProto('instructor'); renderRoster(); renderPick(); counts(); lucide.createIcons();
</script>
</body>
</html>
