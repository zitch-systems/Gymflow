<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080e1c">
<title>Offline — GymFlow</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gymflow.css">
<link rel="stylesheet" href="/gymflow-extra.css">
<script>
// Theme init — before render to prevent flash
(function(){var t=localStorage.getItem('gf-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>
<script src="/js/supabase-config.js"></script>
</head>

<body>
  <div class="status-badge">
    <span class="status-dot"></span>
    No internet connection
  </div>

  <div class="offline-icon">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1 class="offline-title">You're offline</h1>

  <p class="offline-body">
    GymFlow needs an internet connection to sync your data. Check your connection and try again.
  </p>

  <div class="offline-actions">
    <button class="gf-btn gf-btn-primary gf-btn-lg" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Try Again
    </button>
    <button class="gf-btn gf-btn-ghost" onclick="history.back()">Go Back</button>
  </div>

  <div class="logo-wrap">
    <a href="/index.html" class="gf-logo gf-logo-sm">
      <div class="gf-logo-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="8" width="5" height="8" rx="1.5"/>
          <rect x="1" y="10.5" width="7" height="3" rx="1"/>
          <rect x="17" y="8" width="5" height="8" rx="1.5"/>
          <rect x="16" y="10.5" width="7" height="3" rx="1"/>
          <rect x="10.5" y="5" width="3" height="14" rx="1.5"/>
        </svg>
      </div>
      <span class="gf-logo-text">Gym<em>Flow</em></span>
    </a>
  </div>

  <script>
    // Auto-retry when connection returns
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>

<script src="/gf-utils.js"></script>
</body>
</html>
