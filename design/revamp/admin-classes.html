<!DOCTYPE html>
<!-- @dsCard group="Brand" name="GymFlow Revamp — Admin Classes" subtitle="Admin · Classes — week schedule, capacity, waitlists" viewport="1280x940" -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GymFlow — Classes</title>
<link rel="stylesheet" href="admin.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .days { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .day { flex:1; min-width:84px; padding:12px; border-radius:var(--gf-radius-sm); background:var(--gf-surface); border:1px solid var(--gf-border); text-align:center; cursor:pointer; transition:all var(--gf-t); }
  .day:hover { border-color:var(--gf-border-light); }
  .day.on { background:var(--gf-brand-soft); border-color:var(--gf-brand-glow); }
  .day .dn { font-family:var(--gf-font-display); font-weight:700; font-size:0.78rem; color:var(--gf-text-muted); }
  .day.on .dn { color:var(--gf-brand); }
  .day .dd { font-family:var(--gf-font-display); font-weight:800; font-size:1.3rem; margin-top:4px; }
  .day .dc { font-size:0.68rem; color:var(--gf-text-muted); margin-top:2px; }
  .cls-list { display:flex; flex-direction:column; gap:12px; }
  .clx { display:flex; align-items:center; gap:16px; padding:16px; background:var(--gf-surface); border:1px solid var(--gf-border); border-radius:var(--gf-radius); transition:all var(--gf-t); }
  .clx:hover { border-color:var(--gf-border-light); }
  .clx .tm { text-align:center; width:64px; flex-shrink:0; }
  .clx .tm b { font-family:var(--gf-font-display); font-weight:800; font-size:1rem; display:block; }
  .clx .tm span { font-size:0.66rem; color:var(--gf-text-muted); }
  .clx .info { flex:1; min-width:0; }
  .clx .info strong { font-family:var(--gf-font-display); font-size:1rem; font-weight:700; display:block; }
  .clx .info small { color:var(--gf-text-muted); font-size:0.8rem; }
  .clx .cap { width:160px; flex-shrink:0; }
  .clx .cap .lbl { display:flex; justify-content:space-between; font-size:0.74rem; color:var(--gf-text-muted); margin-bottom:6px; }
  .clx .cap .track { height:7px; background:var(--gf-elevated); border-radius:99px; overflow:hidden; }
  .clx .cap .fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gf-brand-light),var(--gf-brand)); }
  .clx .cap .fill.warn { background:linear-gradient(90deg,var(--gf-warning),#e09000); }
  @media (max-width:900px){ .clx{flex-wrap:wrap} .clx .cap{width:100%} }
</style>
</head>
<body>
<div class="app">
  <aside class="gf-sidebar" id="admSidebar"></aside>
  <div class="main">
    <header class="top" id="admTop"></header>
    <main class="content">
      <div class="page-h">
        <div><h1>Classes</h1><p>26 sessions this week · 412 bookings · 78% average fill</p></div>
        <button class="gf-btn gf-btn-secondary"><i data-lucide="repeat" style="width:16px;height:16px"></i> Recurring</button>
      </div>

      <section class="kpis">
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#11d18b1f;color:#11d18b"><i data-lucide="calendar-days"></i></div></div><div class="kpi-val">26</div><div class="kpi-lbl">Sessions / week</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#4080ff1f;color:#4080ff"><i data-lucide="ticket"></i></div><span class="delta up"><i data-lucide="trending-up"></i>+12%</span></div><div class="kpi-val">412</div><div class="kpi-lbl">Bookings</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#c6f24e1f;color:#a8d92e"><i data-lucide="gauge"></i></div></div><div class="kpi-val">78%</div><div class="kpi-lbl">Avg fill rate</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#ffb0201f;color:#ffb020"><i data-lucide="hourglass"></i></div></div><div class="kpi-val">34</div><div class="kpi-lbl">On waitlists</div></div>
      </section>

      <div class="days" id="days">
        <div class="day" data-d="0"><div class="dn">MON</div><div class="dd">26</div><div class="dc">4 classes</div></div>
        <div class="day" data-d="1"><div class="dn">TUE</div><div class="dd">27</div><div class="dc">3 classes</div></div>
        <div class="day" data-d="2"><div class="dn">WED</div><div class="dd">28</div><div class="dc">4 classes</div></div>
        <div class="day on" data-d="3"><div class="dn">THU</div><div class="dd">29</div><div class="dc">4 classes</div></div>
        <div class="day" data-d="4"><div class="dn">FRI</div><div class="dd">30</div><div class="dc">5 classes</div></div>
        <div class="day" data-d="5"><div class="dn">SAT</div><div class="dd">31</div><div class="dc">4 classes</div></div>
        <div class="day" data-d="6"><div class="dn">SUN</div><div class="dd">01</div><div class="dc">2 classes</div></div>
      </div>

      <div class="cls-list" id="list"></div>
    </main>
  </div>
</div>

<nav class="proto" id="proto"></nav>
<script src="proto.js"></script>
<script src="admin-shell.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SCHED = {
  3: [
    { t:'06:30', ap:'AM', n:'Sunrise HIIT', c:'Coach Bisi · Studio A', booked:20, cap:20 },
    { t:'09:00', ap:'AM', n:'Power Lifting', c:'Coach Femi · Weights floor', booked:12, cap:15 },
    { t:'17:30', ap:'PM', n:'Spin Class', c:'Coach Tobi · Spin room', booked:22, cap:24 },
    { t:'19:00', ap:'PM', n:'Yoga Flow', c:'Coach Ada · Studio B', booked:9, cap:16 },
  ],
  4: [
    { t:'06:30', ap:'AM', n:'Sunrise HIIT', c:'Coach Bisi · Studio A', booked:18, cap:20 },
    { t:'08:00', ap:'AM', n:'Boxing', c:'Coach Uche · Ring', booked:14, cap:16 },
    { t:'12:30', ap:'PM', n:'Lunch Express', c:'Coach Femi · Studio A', booked:11, cap:18 },
    { t:'17:30', ap:'PM', n:'Conditioning', c:'Coach Tobi · Studio B', booked:20, cap:20 },
    { t:'19:00', ap:'PM', n:'Pilates', c:'Coach Ada · Studio B', booked:7, cap:14 },
  ],
};
function fillList(d){
  const items = SCHED[d] || SCHED[3];
  $('#list').innerHTML = items.map(x=>{
    const pct = Math.round(x.booked/x.cap*100); const warn = pct>=90;
    const full = x.booked>=x.cap;
    return `<div class="clx">
      <div class="tm"><b>${x.t}</b><span>${x.ap}</span></div>
      <div class="info"><strong>${x.n}</strong><small>${x.c}</small></div>
      <div class="cap"><div class="lbl"><span>${x.booked}/${x.cap} booked</span><span>${pct}%</span></div><div class="track"><div class="fill ${warn?'warn':''}" style="width:${pct}%"></div></div></div>
      ${full?'<span class="gf-badge gf-badge-danger" style="padding:6px 11px">Full</span>':'<button class="gf-btn gf-btn-sm gf-btn-secondary">Manage</button>'}
    </div>`;
  }).join('');
  lucide.createIcons();
}
$$('#days .day').forEach(d=>d.onclick=()=>{ $$('#days .day').forEach(x=>x.classList.remove('on')); d.classList.add('on'); fillList(+d.dataset.d); });
adminShell('classes', { search:'Search classes…', action:{label:'New class', icon:'plus', href:'#'} });
buildProto('admin'); fillList(3); lucide.createIcons();
</script>
</body>
</html>
