# Render Blueprint for gymflow-meta-connector.
#
# In Render: New + > Blueprint > select this repo > when asked for the
# Blueprint file path, enter "gymflow-meta-connector/render.yaml".
#
# Every secret is declared with `sync: false` — Render will prompt for it in
# the dashboard during setup.
services:
  - type: web
    name: gymflow-meta-connector
    runtime: node
    rootDir: gymflow-meta-connector
    plan: starter
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    healthCheckPath: /healthz
    envVars:
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: CONNECTOR_API_KEY
        sync: false
      - key: OAUTH_LOGIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://gymflow-meta-connector.onrender.com"
      - key: META_GRAPH_API_VERSION
        value: "v21.0"
      - key: META_GRAPH_API_BASE_URL
        value: "https://graph.facebook.com"
      - key: GRAPH_TIMEOUT_MS
        value: "10000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"
      - key: IP_RATE_LIMIT_MAX_REQUESTS
        value: "60"
