name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the live Supabase project's major version (17): the drift gate
        # compares deparsed policy/function bodies, and pg_get_expr output can
        # differ between majors.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test (RLS + tenant isolation)
        run: npm test
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      - name: Build
        run: npm run build
        env:
          # Placeholder public values — the app reads NEXT_PUBLIC_* at runtime and
          # RLS is the access authority, so build/prerender only needs them to be
          # present, not real. Secrets (service role, Paystack, cron) are never
          # required to build and are intentionally omitted from CI.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://gymflow.ng

  # Schema-drift gate: the repo's migrations are supposed to BE the schema
  # (DR depends on it). Build a shadow DB from them, fingerprint its structure,
  # and diff against the live Supabase database. Requires the SUPABASE_DB_URL
  # secret (the project's direct Postgres connection string); without it the
  # job no-ops so forks and secret-less PRs stay green.
  schema-drift:
    name: schema drift vs live
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the live Supabase project's major version (17): the drift gate
        # compares deparsed policy/function bodies, and pg_get_expr output can
        # differ between majors.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Gate on secret presence
        id: gate
        run: |
          echo "on=${{ secrets.SUPABASE_DB_URL != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.SUPABASE_DB_URL != '' }}" = "true" ]; then exit 0; fi
          # A silently-skipped drift gate reads exactly like a passing one in the
          # checks list — which is how three security migrations once sat
          # unapplied on the live project for two weeks without CI noticing. On
          # PRs (including from forks, which never receive secrets) warn and
          # skip; on main, where the whole point is to know the live database
          # matches what shipped, an unverifiable schema is a failure.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo '::error::SUPABASE_DB_URL is not set — the live schema cannot be verified against the checked-in migrations. Add the secret (the project'"'"'s direct Postgres connection string) in Settings → Secrets → Actions.'
            exit 1
          fi
          echo '::warning::SUPABASE_DB_URL is not set — the schema-drift gate did NOT run. Live schema is unverified against the checked-in migrations.'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.on == 'true'
        run: npm ci

      - name: Build shadow DB from migrations
        if: steps.gate.outputs.on == 'true'
        id: shadow
        run: echo "url=$(node scripts/shadow-db.mjs | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Diff schema fingerprints (shadow vs live)
        if: steps.gate.outputs.on == 'true'
        env:
          SHADOW_URL: ${{ steps.shadow.outputs.url }}
          LIVE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SHADOW_URL" -X -q -f scripts/schema-fingerprint.sql > shadow.txt
          psql "$LIVE_URL" -X -q -f scripts/schema-fingerprint.sql > live.txt
          if ! diff -u shadow.txt live.txt; then
            echo '::error::Live Supabase schema has drifted from the checked-in migrations (see diff above).'
            exit 1
          fi
          echo "No drift: live schema matches the migrations."
