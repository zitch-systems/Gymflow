name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same ref so we never burn minutes on
# a stale commit when a newer one has already been pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build needs *something* for NEXT_PUBLIC_SUPABASE_URL so the URL() parse
      # in next.config.ts succeeds — value doesn't have to be real.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_anon_key
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_ci
      NEXT_PUBLIC_SITE_URL: https://gymflow.ng
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # `--audit-level=high` fails CI only on high/critical vulns so a noisy
      # low-severity advisory in a transitive doesn't block every PR.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: false
