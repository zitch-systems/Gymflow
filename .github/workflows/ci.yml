name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the live Supabase project's major version (17): the drift gate
        # compares deparsed policy/function bodies, and pg_get_expr output can
        # differ between majors.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test (RLS + tenant isolation)
        run: npm test
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      - name: Build
        run: npm run build
        env:
          # Placeholder public values — the app reads NEXT_PUBLIC_* at runtime and
          # RLS is the access authority, so build/prerender only needs them to be
          # present, not real. Secrets (service role, Paystack, cron) are never
          # required to build and are intentionally omitted from CI.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://gymflow.ng

  # Schema-drift gate (PULL REQUESTS): does the live database already match what
  # this PR says the schema is? Build a shadow DB from the checked-in migrations,
  # fingerprint its structure, and diff it against live. A PR that adds a
  # migration is EXPECTED to differ here — that difference is what the migrate
  # job below applies once the PR lands, so on PRs this is a signal, not a gate
  # on merging.
  #
  # On pushes to main this job does not run: the `migrate` job applies the
  # pending migrations and then runs the very same fingerprint diff to prove the
  # apply worked. Running both would race — this job would fingerprint live
  # while migrate was still writing to it.
  schema-drift:
    name: schema drift vs live
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the live Supabase project's major version (17): the drift gate
        # compares deparsed policy/function bodies, and pg_get_expr output can
        # differ between majors.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Gate on secret presence
        id: gate
        run: |
          echo "on=${{ secrets.SUPABASE_DB_URL != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.SUPABASE_DB_URL != '' }}" = "true" ]; then exit 0; fi
          # Forks never receive secrets, so a PR cannot hard-fail on this. The
          # real enforcement lives on main, where the migrate job refuses to run
          # without the secret.
          echo '::warning::SUPABASE_DB_URL is not set — the schema-drift gate did NOT run. Live schema is unverified against the checked-in migrations.'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.on == 'true'
        run: npm ci

      - name: Build shadow DB from migrations
        if: steps.gate.outputs.on == 'true'
        id: shadow
        run: echo "url=$(node scripts/shadow-db.mjs | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Diff schema fingerprints (shadow vs live)
        if: steps.gate.outputs.on == 'true'
        env:
          SHADOW_URL: ${{ steps.shadow.outputs.url }}
          LIVE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SHADOW_URL" -X -q -f scripts/schema-fingerprint.sql > shadow.txt
          psql "$LIVE_URL" -X -q -f scripts/schema-fingerprint.sql > live.txt
          if ! diff -u shadow.txt live.txt; then
            echo '::warning::Live schema differs from this branch'"'"'s migrations. If this PR adds a migration that is expected — the migrate job applies it on merge. Otherwise the live database has drifted.'
            exit 0
          fi
          echo "No drift: live schema matches the migrations."

  # Apply pending migrations to the live database, then PROVE it worked.
  #
  # This is the step whose absence let a merged security migration sit unapplied
  # in production: migrations were reaching live by hand, and the only automated
  # check (schema-drift) had no secret, so it warn-skipped on PRs and failed
  # every push to main — leaving main permanently red, which is indistinguishable
  # from a real failure.
  #
  # Runs only after the full verify job passes, so nothing reaches the live
  # database that hasn't had lint, type-check, the RLS suite and a build run
  # against it first.
  migrate:
    name: apply migrations to live
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    # One deploy at a time — two merges in quick succession must not apply DDL
    # concurrently. (scripts/migrate.mjs also takes a Postgres advisory lock, so
    # this is belt and braces.)
    concurrency:
      group: migrate-live
      cancel-in-progress: false
    services:
      postgres:
        # Only used to build the shadow DB for the post-apply verification.
        # Matches the live project's major version (17) — pg_get_expr output
        # differs between majors and would show as phantom drift.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Require the database secret
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo '::error::SUPABASE_DB_URL is not set, so migrations cannot be applied to production. Add the project'"'"'s direct Postgres connection string in Settings → Secrets → Actions → SUPABASE_DB_URL.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show the plan
        run: node scripts/migrate.mjs --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply pending migrations
        run: node scripts/migrate.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Applying without verifying would just move the blind spot. Rebuild the
      # shadow from the migrations and diff it against live: if they match, the
      # live database provably IS what the repo says it is.
      - name: Build shadow DB from migrations
        id: shadow
        run: echo "url=$(node scripts/shadow-db.mjs | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Verify live now matches the migrations
        env:
          SHADOW_URL: ${{ steps.shadow.outputs.url }}
          LIVE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SHADOW_URL" -X -q -f scripts/schema-fingerprint.sql > shadow.txt
          psql "$LIVE_URL" -X -q -f scripts/schema-fingerprint.sql > live.txt
          if ! diff -u shadow.txt live.txt; then
            echo '::error::Migrations applied but the live schema still differs from the checked-in migrations (see diff above).'
            exit 1
          fi
          echo "Live schema matches the migrations."

  # Production deploy — the step that makes migrations GATE the release.
  #
  # Vercel's Git integration used to deploy main on push, in parallel with the
  # migrate job above. Nothing sequenced the two, so every migration-bearing
  # merge opened a window where production ran code whose migration had not
  # landed yet. That window was real, not theoretical: on 2026-08-20 the app
  # went live at 13:09:24 UTC calling public.extend_member_sub, and the function
  # was created at 13:12:08 — ~2m44s in which every membership renewal would
  # have failed on a missing function.
  #
  # So the Git trigger for main is switched off (vercel.json → git.
  # deploymentEnabled.main = false) and the deploy is issued from here instead,
  # after `migrate` has both applied the migrations and proved the live schema
  # matches them. Ordering is now verify → migrate → deploy, and a failed
  # migration means no deploy at all rather than a deploy racing ahead of it.
  #
  # Only the `gymflow` project moves. gymflow-meta-connector has its own
  # vercel.json under its root directory, ships no migrations, and keeps
  # deploying straight from Git. PR previews are untouched — deploymentEnabled
  # names only `main`, so every other branch still auto-deploys.
  deploy:
    name: deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    # Never let two merges deploy at once, and never cancel one midway: a
    # half-finished deploy is worse than a queued one.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Fail loudly and by name. With the Git trigger off, a missing secret
      # means production simply stops receiving deploys — the one failure mode
      # that is easy not to notice, so it must never be a silent skip.
      - name: Require the Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          if [ -z "$VERCEL_TOKEN" ]; then missing="$missing VERCEL_TOKEN"; fi
          if [ -z "$VERCEL_ORG_ID" ]; then missing="$missing VERCEL_ORG_ID"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then missing="$missing VERCEL_PROJECT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing — production cannot be deployed. Add them in Settings → Secrets → Actions. VERCEL_ORG_ID and VERCEL_PROJECT_ID are in the Vercel project's Settings → General (or .vercel/project.json after \`vercel link\`); VERCEL_TOKEN is a personal/team token from Vercel → Account Settings → Tokens with access to this project."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Vercel's project settings detect pnpm-lock.yaml and shell out to `pnpm`
      # during `vercel build`. The GitHub runner doesn't ship pnpm, so without
      # this step the build dies with `spawn pnpm ENOENT` before it can install
      # a single dependency. pnpm@10 matches the version Vercel picks by
      # project-creation date (logged at build start).
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install the Vercel CLI
        run: npm i -g vercel@latest

      # `vercel pull` answers every one of "token scoped to the wrong account",
      # "wrong org/project id" and "whitespace pasted into a secret" with the
      # same unhelpful line: "Could not retrieve Project Settings." Rather than
      # guess between them one re-run at a time, print exactly enough to tell
      # them apart — and nothing that could expose a secret.
      #
      # The ids are not secrets in any meaningful sense (they identify a
      # project, they do not authorise anything), but they are stored as
      # secrets, so only their LENGTH and non-secret prefix are printed. A value
      # pasted with a trailing newline reads one longer than it looks:
      #   VERCEL_ORG_ID     expected length 29, prefix "team_"
      #   VERCEL_PROJECT_ID expected length 32, prefix "prj_"
      # whoami/teams/projects then show what the TOKEN can actually reach: if
      # the org the ids name is absent from that list, the token is scoped to
      # the wrong account, whatever the ids say.
      #
      # continue-on-error so this never becomes the thing that fails the deploy;
      # the real gate is the pull below.
      - name: Diagnose Vercel access
        continue-on-error: true
        env:
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJ: ${{ secrets.VERCEL_PROJECT_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "VERCEL_ORG_ID     length=${#ORG}  prefix=${ORG:0:5}   (expect 29 / team_)"
          echo "VERCEL_PROJECT_ID length=${#PROJ} prefix=${PROJ:0:4}  (expect 32 / prj_)"
          echo "VERCEL_TOKEN      length=${#TOKEN}"
          echo "--- whoami (who the token is) ---"
          vercel whoami --token="$TOKEN" || true
          echo "--- scopes this token can reach ---"
          vercel teams ls --token="$TOKEN" || true
          echo "--- projects visible under VERCEL_ORG_ID ---"
          vercel projects ls --token="$TOKEN" || true

      # `vercel pull` fetches the project's REAL production environment from
      # Vercel, so this build sees the same variables the Git-triggered build
      # saw. The placeholder NEXT_PUBLIC_* values used by the verify job are
      # deliberately not reused here — that build proves the code compiles, this
      # one is the artifact that actually serves traffic.
      - name: Pull the production environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
