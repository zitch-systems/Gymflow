name: iOS device artifact delivery

on:
  push:
    branches: [verify/gymflow-android-20261002]
    paths: ['.github/workflows/ios-artifact-delivery.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Native build run containing the unsigned iOS device artifact
        required: true
        default: '37068901423'
        type: string
      expected_sha:
        description: Exact native source commit
        required: true
        default: '601b854edd12a713abaaec8031e62cc238108736'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ inputs.run_id || '37068901423' }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha || '601b854edd12a713abaaec8031e62cc238108736' }}
    steps:
      - name: Download and authenticate the already-compiled artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p artifact
          node <<'NODE'
          (async () => {
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const api = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          async function json(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}`);
            return response.json();
          }
          const run = await json(`${api}/actions/runs/${process.env.SOURCE_RUN_ID}`);
          if (run.head_sha !== process.env.EXPECTED_SOURCE_SHA) throw new Error(`Source SHA mismatch: expected ${process.env.EXPECTED_SOURCE_SHA}, received ${run.head_sha}`);
          const listing = await json(`${api}/actions/runs/${process.env.SOURCE_RUN_ID}/artifacts?name=gymflow-ios-device-unsigned-release`);
          const artifact = listing.artifacts.find((item) => item.name === 'gymflow-ios-device-unsigned-release' && !item.expired);
          if (!artifact?.digest?.startsWith('sha256:')) throw new Error('Artifact or SHA-256 digest missing');
          const response = await fetch(artifact.archive_download_url, { headers, redirect: 'follow' });
          if (!response.ok) throw new Error(`Artifact download ${response.status}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          const digest = `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
          if (digest !== artifact.digest) throw new Error(`Artifact digest mismatch: expected ${artifact.digest}, received ${digest}`);
          fs.writeFileSync('artifact.zip', bytes);
          fs.writeFileSync('artifact/source-verification.txt', `run_id=${run.id}\nhead_sha=${run.head_sha}\nartifact_id=${artifact.id}\ndigest=${digest}\n`);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Prepare checksum-verified transfer parts
        run: |
          sha256sum artifact.zip > artifact/SHA256SUMS
          split -b 24m -d -a 2 artifact.zip artifact/ios-part-
          test "$(find artifact -name 'ios-part-*' | wc -l)" -le 4
      - name: Upload source and checksum evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gymflow-ios-device-delivery-checksums
          path: |
            artifact/SHA256SUMS
            artifact/source-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS device part 00
        if: ${{ hashFiles('artifact/ios-part-00') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gymflow-ios-device-part-00
          path: artifact/ios-part-00
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS device part 01
        if: ${{ hashFiles('artifact/ios-part-01') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gymflow-ios-device-part-01
          path: artifact/ios-part-01
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS device part 02
        if: ${{ hashFiles('artifact/ios-part-02') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gymflow-ios-device-part-02
          path: artifact/ios-part-02
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS device part 03
        if: ${{ hashFiles('artifact/ios-part-03') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gymflow-ios-device-part-03
          path: artifact/ios-part-03
          if-no-files-found: error
          retention-days: 14
