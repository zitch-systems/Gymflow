<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080e1c">
<title>Check In — GymFlow</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gymflow.css">
<link rel="stylesheet" href="/tailwind_built.css">
<link rel="stylesheet" href="/gymflow-extra.css">
<script>
// Theme init — before render to prevent flash
(function(){var t=localStorage.getItem('gf-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>
<!-- Supabase: CDN library + self-bootstrapping client (loads in order) -->
<script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/error-tracker.js" defer></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body class="min-h-screen antialiased">

<div id="pageLoader" class="gf-page-loader">
  <div class="loader-logo">Gym<em>Flow</em></div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<div class="header">
  <a href="/member-dashboard.html" class="back">← Back</a>
  <h1>📷 Check In</h1>
  <div style="width:60px"></div>
</div>

<div class="scanner-wrap gf-animate-slide-up">
  <div class="scanner-box gf-lift">
    <div id="reader"></div>
    <button type="button" class="cam-toggle" id="camToggle" style="display:none">🔄 Switch</button>
    <div class="manual-section gf-glass">
      <label>Or enter Member ID manually</label>
      <input aria-label="Input field" type="text" id="manualId" placeholder="e.g. your-user-id" maxlength="40">
      <button type="button" id="manualBtn" onclick="manualCheckIn()">Check In</button>
    </div>
  </div>
</div>

<div class="recent-checkins gf-animate-fade" id="recentSection" style="display:none">
  <h3>Recent Check-ins</h3>
  <div id="recentList"></div>
</div>

<!-- Result Overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card gf-glass">
    <div class="result-icon" id="resultIcon">✓</div>
    <h2 id="resultTitle">Welcome!</h2>
    <p id="resultMessage">You have been checked in.</p>
    <div class="meta" id="resultMeta"></div>
    <button type="button" class="primary" id="resultBtn" onclick="closeResult()">Scan Again</button>
    <button type="button" class="secondary" onclick="goDashboard()">Back to Dashboard</button>
  </div>
</div>

<script type="module">
import { client, loadGym, getUser, toast, daysLeft, fmtDate } from '/js/supabase.js';

const gym = await loadGym();
const user = await getUser();

let html5QrCode = null;
let currentCamera = 'environment';
let isProcessing = false;

function showToast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(()=>el.remove(),400); }, 3000);
}

function initScanner() {
  html5QrCode = new Html5Qrcode('reader');
  const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] };
  html5QrCode.start({ facingMode: currentCamera }, config, onScanSuccess, onScanFailure)
    .then(() => { document.getElementById('camToggle').style.display = 'block'; })
    .catch(err => { console.error('Camera error:', err); showToast('Camera access denied. Use manual entry.', 'error'); });
}

function onScanSuccess(decodedText) {
  if (isProcessing) return;
  isProcessing = true;
  html5QrCode.pause(true);

  let qrData;
  try { qrData = JSON.parse(decodedText); }
  catch { qrData = { member_id: decodedText.trim(), gym_id: gym?.id }; }

  processCheckIn(qrData);
}

function onScanFailure(error) { /* ignore continuous errors */ }

document.getElementById('camToggle').addEventListener('click', async () => {
  currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
  await html5QrCode.stop();
  initScanner();
});

async function manualCheckIn() {
  const input = document.getElementById('manualId');
  const btn = document.getElementById('manualBtn');
  const memberId = input.value.trim();
  if (!memberId) { showToast('Please enter a Member ID', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Checking...';

  await processCheckIn({ member_id: memberId, gym_id: gym?.id });

  btn.disabled = false;
  btn.textContent = 'Check In';
  input.value = '';
}

async function processCheckIn(qrData) {
  const { member_id, gym_id } = qrData;
  if (!member_id) { showResult('error', 'Invalid QR', 'No member ID found.', null); return; }
  if (!gym_id && !gym) { showResult('error', 'No Gym', 'Cannot determine gym. Please try manual entry.', null); return; }

  const targetGymId = gym_id || gym.id;

  // Call check-in function
  try {
    const res = await fetch('/.netlify/functions/check-in', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ member_id, gym_id: targetGymId, device_info: navigator.userAgent }),
    });
    const result = await res.json();

    if (!res.ok) {
      if (res.status === 429) {
        showResult('warning', 'Already Checked In', 'You checked in within the last 2 hours.', null);
      } else {
        showResult('error', 'Check-in Failed', result.error || 'Unknown error', null);
      }
      return;
    }

    // Success
    const sub = result.subscription;
    const metaHtml = `
      <strong>Status:</strong> ${sub ? '✓ Active (' + sub.days_left + ' days left)' : '⚠ No active subscription'}<br>
      <strong>Time:</strong> ${new Date().toLocaleTimeString('en-NG')}<br>
      <strong>Gym:</strong> ${gym?.name || 'Unknown'}
    `;

    playSuccessSound();
    showResult('success', 'Welcome!', 'You have been successfully checked in.', metaHtml);
    saveRecent({ time: new Date(), status: 'ok' });
    loadRecent();

  } catch (err) {
    showResult('error', 'Error', err.message, null);
  }
}

function showResult(type, title, message, meta) {
  const overlay = document.getElementById('resultOverlay');
  const icon = document.getElementById('resultIcon');
  const titleEl = document.getElementById('resultTitle');
  const msgEl = document.getElementById('resultMessage');
  const metaEl = document.getElementById('resultMeta');
  const btn = document.getElementById('resultBtn');

  icon.className = 'result-icon ' + type;
  icon.textContent = type === 'success' ? '✓' : type === 'warning' ? '!' : '✕';
  titleEl.textContent = title;
  msgEl.textContent = message;
  metaEl.innerHTML = meta || '';
  metaEl.style.display = meta ? 'block' : 'none';
  btn.textContent = type === 'error' ? 'Try Again' : 'Scan Again';
  overlay.classList.add('active');
}

window.closeResult = function() {
  document.getElementById('resultOverlay').classList.remove('active');
  isProcessing = false;
  if (html5QrCode) html5QrCode.resume();
};

window.goDashboard = function() {
  window.location.href = '/member-dashboard.html';
};

function playSuccessSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, ctx.currentTime + i*0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.15 + 0.3);
      osc.start(ctx.currentTime + i*0.15);
      osc.stop(ctx.currentTime + i*0.15 + 0.3);
    });
  } catch(e) {}
}

function saveRecent(entry) {
  const key = 'gf_recent_' + (gym?.id || 'demo');
  let recent = JSON.parse(localStorage.getItem(key) || '[]');
  recent.unshift(entry);
  recent = recent.slice(0, 10);
  localStorage.setItem(key, JSON.stringify(recent));
}

function loadRecent() {
  const key = 'gf_recent_' + (gym?.id || 'demo');
  const recent = JSON.parse(localStorage.getItem(key) || '[]');
  const container = document.getElementById('recentList');
  const section = document.getElementById('recentSection');
  if (!recent.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  container.innerHTML = recent.map(r => `
    <div class="checkin-item">
      <div>
        <div style="font-weight:600;font-size:14px">${gym?.name || 'Check-in'}</div>
        <div class="time">${new Date(r.time).toLocaleTimeString('en-NG')}</div>
      </div>
      <span class="status ${r.status}">${r.status === 'ok' ? 'Checked In' : 'Flagged'}</span>
    </div>
  `).join('');
}

document.getElementById('manualId').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') manualCheckIn();
});

initScanner();
loadRecent();
</script>

  

<script src="/gf-utils.js"></script>
</body>
</html>
