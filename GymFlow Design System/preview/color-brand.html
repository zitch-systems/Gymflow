<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div class="row"><div><div class="sw" style="width:116px;height:60px;background:#4fe3a8"></div><div class="nm">brand-light</div><div class="hex">#4fe3a8</div></div><div><div class="sw" style="width:116px;height:60px;background:#11d18b"></div><div class="nm">brand</div><div class="hex">#11d18b</div></div><div><div class="sw" style="width:116px;height:60px;background:#07a86c"></div><div class="nm">brand-dark</div><div class="hex">#07a86c</div></div><div><div class="sw" style="width:116px;height:60px;background:rgba(17,209,139,.10)"></div><div class="nm">brand-soft</div><div class="hex">10% tint</div></div></div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
