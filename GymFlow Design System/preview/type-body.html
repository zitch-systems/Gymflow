<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div style="max-width:560px;display:flex;flex-direction:column;gap:8px">
  <div style="font:var(--gf-type-body);color:var(--gf-text)">Body · Check-ins, Paystack subscriptions, class booking and automated reminders — one mobile-first platform.</div>
  <div style="font:var(--gf-type-small);color:var(--gf-text-muted)">Small · 13px · used for hints, captions and table meta.</div>
  <div class="cap" style="margin-top:4px">Inter · 400–600 · line-height 1.5–1.6</div>
</div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
