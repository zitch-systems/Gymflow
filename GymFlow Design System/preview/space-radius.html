<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div class="row" style="align-items:flex-end"><div><div style="width:74px;height:60px;background:var(--gf-elevated);border:1px solid var(--gf-border);border-radius:8px"></div><div class="nm">xs</div><div class="hex">8px</div></div><div><div style="width:74px;height:60px;background:var(--gf-elevated);border:1px solid var(--gf-border);border-radius:12px"></div><div class="nm">sm</div><div class="hex">12px</div></div><div><div style="width:74px;height:60px;background:var(--gf-elevated);border:1px solid var(--gf-border);border-radius:16px"></div><div class="nm">base</div><div class="hex">16px</div></div><div><div style="width:74px;height:60px;background:var(--gf-elevated);border:1px solid var(--gf-border);border-radius:20px"></div><div class="nm">lg</div><div class="hex">20px</div></div><div><div style="width:74px;height:60px;background:var(--gf-elevated);border:1px solid var(--gf-border);border-radius:24px"></div><div class="nm">xl</div><div class="hex">24px</div></div><div><div style="width:74px;height:60px;background:var(--gf-elevated);border:1px solid var(--gf-border);border-radius:999px"></div><div class="nm">pill</div><div class="hex">999px</div></div></div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
