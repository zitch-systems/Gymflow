<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div class="row"><div><div class="sw" style="width:116px;height:60px;background:#00c896"></div><div class="nm">success</div><div class="hex">#00c896</div></div><div><div class="sw" style="width:116px;height:60px;background:#ffb020"></div><div class="nm">warning</div><div class="hex">#ffb020</div></div><div><div class="sw" style="width:116px;height:60px;background:#ff4560"></div><div class="nm">danger</div><div class="hex">#ff4560</div></div><div><div class="sw" style="width:116px;height:60px;background:#4080ff"></div><div class="nm">info</div><div class="hex">#4080ff</div></div></div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
