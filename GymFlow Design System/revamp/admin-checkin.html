<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GymFlow — Check-In</title>
<link rel="stylesheet" href="admin.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .ci-grid { display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:start; }
  .scan { background:linear-gradient(150deg,var(--gf-surface),var(--gf-elevated)); border:1px solid var(--gf-border-glow); border-radius:var(--gf-radius-lg); padding:28px; text-align:center; box-shadow:var(--gf-shadow-glow); }
  .scan .ring { width:96px; height:96px; border-radius:50%; background:var(--gf-brand-soft); border:2px solid var(--gf-border-glow); display:grid; place-items:center; margin:0 auto 16px; }
  .scan .ring i { width:44px; height:44px; color:var(--gf-brand); }
  .scan h2 { font-family:var(--gf-font-display); font-weight:800; font-size:1.3rem; margin:0 0 6px; }
  .scan p { color:var(--gf-text-secondary); font-size:0.9rem; margin:0 0 20px; }
  .scan .find { position:relative; max-width:340px; margin:0 auto; }
  .scan .find i { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--gf-text-muted); }
  .scan .find input { width:100%; background:var(--gf-bg); border:1.5px solid var(--gf-border); color:var(--gf-text); border-radius:var(--gf-radius-sm); padding:13px 14px 13px 42px; font-family:var(--gf-font-body); font-size:0.95rem; outline:none; }
  .scan .find input:focus { border-color:var(--gf-brand); box-shadow:0 0 0 3px var(--gf-brand-soft); }
  .sug { margin-top:10px; display:flex; flex-direction:column; gap:6px; text-align:left; max-width:340px; margin-left:auto; margin-right:auto; }
  .sug button { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--gf-surface); border:1px solid var(--gf-border); border-radius:var(--gf-radius-sm); color:var(--gf-text); font-family:var(--gf-font-body); font-size:0.86rem; cursor:pointer; transition:all var(--gf-t); }
  .sug button:hover { border-color:var(--gf-brand); }
  .sug .gf-avatar { background:var(--gf-brand-soft); color:var(--gf-brand); border-color:var(--gf-brand-glow); font-size:0.7rem; }
  .feed-row { display:flex; align-items:center; gap:12px; padding:11px 8px; border-radius:var(--gf-radius-sm); transition:background var(--gf-t); }
  .feed-row:hover { background:var(--gf-elevated); }
  .feed-row.fresh { background:var(--gf-brand-soft); animation:pop .45s var(--gf-ease-spring); }
  @keyframes pop { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
  .feed-row .gf-avatar { background:var(--gf-brand-soft); color:var(--gf-brand); border-color:var(--gf-brand-glow); font-size:0.76rem; }
  .feed-row .m { flex:1; min-width:0; }
  .feed-row .m strong { font-family:var(--gf-font-display); font-size:0.88rem; font-weight:600; display:block; }
  .feed-row .m small { color:var(--gf-text-muted); font-size:0.74rem; }
  .feed-row .t { font-size:0.74rem; color:var(--gf-text-muted); font-variant-numeric:tabular-nums; }
  @media (max-width:1000px){ .ci-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <aside class="gf-sidebar" id="admSidebar"></aside>
  <div class="main">
    <header class="top" id="admTop"></header>
    <main class="content">
      <div class="page-h"><div><h1>Check-In</h1><p id="ciSub">Friday, 30 May · 14 members in so far today</p></div></div>

      <section class="kpis" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#11d18b1f;color:#11d18b"><i data-lucide="scan-line"></i></div></div><div class="kpi-val" id="kToday">14</div><div class="kpi-lbl">Check-ins today</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#4080ff1f;color:#4080ff"><i data-lucide="clock"></i></div></div><div class="kpi-val">7:02</div><div class="kpi-lbl">Last check-in</div></div>
        <div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#c6f24e1f;color:#a8d92e"><i data-lucide="trending-up"></i></div></div><div class="kpi-val">68</div><div class="kpi-lbl">Peak hour (6–7am)</div></div>
      </section>

      <section class="ci-grid">
        <div class="scan">
          <div class="ring"><i data-lucide="qr-code"></i></div>
          <h2>Scan or search to check in</h2>
          <p>Members scan the door QR, or find them manually below.</p>
          <div class="find"><i data-lucide="search"></i><input id="q" placeholder="Type a member name…" autocomplete="off" /></div>
          <div class="sug" id="sug"></div>
        </div>
        <div class="panel">
          <div class="panel-h"><div><h3>Today's check-ins</h3><div class="sub"><span class="gf-status-dot active" style="font-size:0.78rem">Live</span></div></div></div>
          <div id="feed"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="toast" id="toast"><i data-lucide="check-circle-2"></i><span id="toastMsg">Done</span></div>
<nav class="proto" id="proto"></nav>
<script src="proto.js"></script>
<script src="admin-shell.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const MEMBERS=[['Tunde Adeyemi','T'],['Ngozi Eze','N'],['Kelechi Obi','K'],['Aisha Bello','A'],['Emeka Nwosu','E'],['Fatima Yusuf','F'],['David Okon','D'],['Grace Udo','G'],['Musa Ibrahim','M']];
let feed=[['Tunde Adeyemi','T','QR · Main entrance','7:02'],['Kelechi Obi','K','QR · Main entrance','6:58'],['Emeka Nwosu','E','Front desk','6:44'],['Aisha Bello','A','QR · Main entrance','6:31']];
let count=14;
function renderFeed(fresh){ $('#feed').innerHTML=feed.slice(0,8).map((f,i)=>`<div class="feed-row ${fresh&&i===0?'fresh':''}"><span class="gf-avatar gf-avatar-sm">${f[1]}</span><div class="m"><strong>${f[0]}</strong><small>${f[2]}</small></div><span class="t">${f[3]}</span></div>`).join(''); lucide.createIcons(); }
function renderSug(){ const q=$('#q').value.toLowerCase().trim(); const list=q?MEMBERS.filter(m=>m[0].toLowerCase().includes(q)):[]; $('#sug').innerHTML=list.map(m=>`<button data-n="${m[0]}" data-i="${m[1]}"><span class="gf-avatar gf-avatar-sm">${m[1]}</span>${m[0]}<span style="margin-left:auto;color:var(--gf-brand);font-family:var(--gf-font-display);font-weight:600;font-size:0.78rem">Check in →</span></button>`).join(''); lucide.createIcons(); $$('#sug button').forEach(b=>b.onclick=()=>checkIn(b.dataset.n,b.dataset.i)); }
function checkIn(n,i){ feed.unshift([n,i,'Front desk','just now']); count++; $('#kToday').textContent=count; $('#ciSub').textContent='Friday, 30 May · '+count+' members in so far today'; $('#q').value=''; renderSug(); renderFeed(true); toast(n+' checked in'); }
function toast(m){ $('#toastMsg').textContent=m; $('#toast').classList.add('show'); setTimeout(()=>$('#toast').classList.remove('show'),2000); }
$('#q').oninput=renderSug;
$('#q').onkeydown=e=>{ if(e.key==='Enter'){ const f=$('#sug button'); if(f) f.click(); } };
adminShell('checkin', { search:'Search members…' });
buildProto('admin'); renderFeed(); lucide.createIcons();
</script>
</body>
</html>
