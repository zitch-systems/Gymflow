<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080e1c">
<title>Sign In — GymFlow</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gymflow.css">
<link rel="stylesheet" href="/tailwind_built.css">
<link rel="stylesheet" href="/gymflow-extra.css">
<script>
// Theme init — before render to prevent flash
(function(){var t=localStorage.getItem('gf-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>
<!-- Supabase: CDN library + self-bootstrapping client (loads in order) -->
<script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
</head>

<body>

<div class="login-wrap">
  <!-- Header -->
  <div class="login-header">
    <a href="/index.html" class="gf-logo gf-logo-lg" style="display:inline-flex;margin-bottom:16px;">
      <div class="gf-logo-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="8" width="5" height="8" rx="1.5"/>
          <rect x="1" y="10.5" width="7" height="3" rx="1"/>
          <rect x="17" y="8" width="5" height="8" rx="1.5"/>
          <rect x="16" y="10.5" width="7" height="3" rx="1"/>
          <rect x="10.5" y="5" width="3" height="14" rx="1.5"/>
        </svg>
      </div>
    </a>

    <div id="gym-avatar" class="gym-avatar">G</div>
    <h1 id="gym-name" class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Sign in to your membership portal</p>
  </div>

  <!-- Success Banner (from join page redirect) -->
  <div id="welcome-msg" class="success-msg" style="margin-bottom:16px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    Account created! Sign in to continue.
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <!-- Error -->
    <div id="error-msg" class="error-msg" style="margin-bottom:16px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="error-text">Invalid email or password.</span>
    </div>

    <form id="login-form" class="form-stack" novalidate>
      <div class="gf-form-group">
        <label class="gf-form-label" for="email">Email address</label>
        <div class="gf-input-group">
          <svg class="gf-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="email" name="email" class="gf-input" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="gf-form-group">
        <label class="gf-form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" class="gf-input" placeholder="Your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a href="#" id="forgot-link" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" id="submit-btn" class="gf-btn gf-btn-primary gf-btn-full gf-btn-lg">
        <span id="btn-text">Sign In</span>
        <span id="btn-spinner" class="gf-spinner" style="display:none;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></span>
      </button>
    </form>
  </div>

  <!-- Footer -->
  <p class="login-footer">New member? <a id="join-link" href="/join.html">Create account</a></p>
  <p class="login-footer" style="margin-top:8px;font-size:0.8125rem;">
    Gym admin? <a href="/admin-dashboard.html">Go to admin portal →</a>
  </p>
</div>

<!-- Theme Toggle -->
<button class="theme-toggle-btn" id="theme-btn" title="Toggle dark/light mode">
  <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<!-- Toast -->
<div class="gf-toast-container" id="toast-container"></div>
<script>
(function() {
  'use strict';

  // ── Theme ──
  const themeBtn = document.getElementById('theme-btn');
  if (themeBtn) {
    themeBtn.addEventListener('click', function() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('gf-theme', next);
    });
  }

  // ── Toast ──
  function toast(msg, type) {
    type = type || 'info';
    const icons = {
      success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
      error:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      warning: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    };
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'gf-toast gf-toast-' + type;
    el.innerHTML = (icons[type] || '') + '<span>' + msg + '</span>';
    container.appendChild(el);
    requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
    setTimeout(() => {
      el.classList.add('hide');
      setTimeout(() => el.remove(), 500);
    }, 3500);
  }
  window.toast = toast;

  // ── Password Toggle ──
  const pwToggle = document.getElementById('pw-toggle');
  const pwInput  = document.getElementById('password');
  if (pwToggle && pwInput) {
    pwToggle.addEventListener('click', function() {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      document.getElementById('eye-icon').innerHTML = isText
        ? '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    });
  }

  // ── Check for welcome param ──
  const params = new URLSearchParams(window.location.search);
  if (params.get('welcome') === '1') {
    document.getElementById('welcome-msg').classList.add('show');
  }

  // ── Resolve Supabase client (async bootstrap) ──
  // GF_SUPABASE_READY is a Promise<client> created by /js/supabase-config.js
  let client = null;
  const clientReady = (window.GF_SUPABASE_READY || Promise.reject(new Error('Supabase loader missing')))
    .then(function(c) { client = c; return c; })
    .catch(function(err) { console.error('[GF] Supabase init failed:', err); return null; });

  // ── Load gym from URL slug (runs after client is ready) ──
  const gymSlug = params.get('gym') || localStorage.getItem('gf-gym-slug');
  if (gymSlug) {
    clientReady.then(function(c) {
      if (!c) return;
      return c.from('gyms').select('id,name,slug,logo_url').eq('slug', gymSlug).maybeSingle();
    }).then(function(res) {
      if (!res || !res.data) return;
      const gym = res.data;
      localStorage.setItem('gf-gym-slug', gym.slug);
      const nameEl = document.getElementById('gym-name');
      if (nameEl) nameEl.textContent = gym.name;
      const av = document.getElementById('gym-avatar');
      if (av) {
        if (gym.logo_url) {
          av.innerHTML = '<img src="' + gym.logo_url + '" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" alt="">';
        } else {
          av.textContent = gym.name.charAt(0).toUpperCase();
        }
      }
      const joinLink = document.getElementById('join-link');
      if (joinLink) joinLink.href = '/join.html?gym=' + encodeURIComponent(gym.slug);
    }).catch(function(err) { console.warn('Gym load error:', err); });
  }

  // ── Forgot Password ──
  document.getElementById('forgot-link').addEventListener('click', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) { toast('Enter your email first', 'warning'); return; }
    const c = await clientReady;
    if (!c) { toast('Service unavailable. Please refresh.', 'error'); return; }
    try {
      const res = await c.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html?reset=1'
      });
      if (res.error) toast(res.error.message, 'error');
      else toast('Password reset link sent — check your email', 'success');
    } catch (err) {
      toast(err.message || 'Failed to send reset link', 'error');
    }
  });

  // ── Login Form ──
  const form    = document.getElementById('login-form');
  const errorEl = document.getElementById('error-msg');
  const errorTx = document.getElementById('error-text');
  const submitBtn = document.getElementById('submit-btn');
  const btnText   = document.getElementById('btn-text');
  const btnSpinner = document.getElementById('btn-spinner');

  function showError(msg) {
    errorTx.textContent = msg;
    errorEl.classList.add('show');
  }
  function hideError() { errorEl.classList.remove('show'); }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    btnText.textContent = loading ? 'Signing in…' : 'Sign In';
    btnSpinner.style.display = loading ? 'block' : 'none';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideError();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) { showError('Please fill in all fields.'); return; }

    setLoading(true);

    try {
      const c = await clientReady;
      if (!c) throw new Error('Service not configured. Please refresh and try again.');
      const { data, error } = await c.auth.signInWithPassword({ email, password });
      if (error) throw error;

      // Determine redirect based on role
      const userId = data.user.id;
      const { data: profile } = await c.from('profiles').select('role,gym_id').eq('id', userId).maybeSingle();

      toast('Welcome back!', 'success');

      let redirect = params.get('redirect') || '/member-dashboard.html';
      if (profile) {
        if (profile.role === 'platform_admin') redirect = '/superadmin.html';
        else if (['gym_owner','manager','front_desk','accountant'].includes(profile.role)) redirect = '/admin-dashboard.html';
        else if (profile.role === 'instructor') redirect = '/instructor.html';
        else redirect = '/member-dashboard.html';
      }

      setTimeout(() => { window.location.href = redirect; }, 700);
    } catch (err) {
      const msg = err.message || 'Sign in failed';
      showError(msg.includes('Invalid') ? 'Invalid email or password. Try again.' : msg);
      setLoading(false);
    }
  });

  // ── Service Worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(function(reg) { console.log('[GymFlow SW]', reg.scope); })
      .catch(function(err) { console.warn('[GymFlow SW] Failed:', err); });
  }
})();
</script>

<script src="/gf-utils.js"></script>
</body>
</html>
