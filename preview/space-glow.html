<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div class="row" style="gap:22px;padding:10px 0">
  <div><div style="width:120px;height:60px;background:var(--gf-surface);border:1px solid var(--gf-border-glow);border-radius:14px;box-shadow:var(--gf-shadow-glow)"></div><div class="nm">glow</div></div>
  <div><div style="width:120px;height:60px;background:linear-gradient(135deg,var(--gf-brand),var(--gf-brand-dark));border-radius:14px;box-shadow:var(--gf-shadow-glow-strong)"></div><div class="nm">glow-strong</div></div>
</div><div class="cap" style="margin-top:8px">Reserved for primary CTA, active brand elements & "popular" cards.</div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
