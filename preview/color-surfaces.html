<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div class="row"><div><div class="sw" style="width:96px;height:60px;background:#0a0a12"></div><div class="nm">bg</div><div class="hex">#0a0a12</div></div><div><div class="sw" style="width:96px;height:60px;background:#12121e"></div><div class="nm">surface</div><div class="hex">#12121e</div></div><div><div class="sw" style="width:96px;height:60px;background:#1b1b2b"></div><div class="nm">elevated</div><div class="hex">#1b1b2b</div></div><div><div class="sw" style="width:96px;height:60px;background:#2a2a40"></div><div class="nm">border</div><div class="hex">#2a2a40</div></div><div><div class="sw" style="width:96px;height:60px;background:#3d3d5a"></div><div class="nm">border-light</div><div class="hex">#3d3d5a</div></div></div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
