<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="font-family:var(--gf-font-display);font-weight:800;font-size:40px;letter-spacing:-.045em;line-height:1.04">Run your gym <span style="color:var(--gf-brand)">the modern way</span></div>
  <div style="font:var(--gf-type-h2)">H2 · Everything your gym needs</div>
  <div style="font:var(--gf-type-h3)">H3 · Live in an afternoon</div>
  <div class="cap" style="margin-top:6px">Plus Jakarta Sans · 700–800 · tight negative tracking</div>
</div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
