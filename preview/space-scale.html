<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div class="row" style="align-items:flex-end"><div><div style="width:4px;height:4px;background:var(--gf-brand);border-radius:3px"></div><div class="hex" style="text-align:center">4</div></div><div><div style="width:8px;height:8px;background:var(--gf-brand);border-radius:3px"></div><div class="hex" style="text-align:center">8</div></div><div><div style="width:12px;height:12px;background:var(--gf-brand);border-radius:3px"></div><div class="hex" style="text-align:center">12</div></div><div><div style="width:16px;height:16px;background:var(--gf-brand);border-radius:3px"></div><div class="hex" style="text-align:center">16</div></div><div><div style="width:20px;height:20px;background:var(--gf-brand);border-radius:3px"></div><div class="hex" style="text-align:center">20</div></div><div><div style="width:24px;height:24px;background:var(--gf-brand);border-radius:3px"></div><div class="hex" style="text-align:center">24</div></div><div><div style="width:32px;height:32px;background:var(--gf-brand);border-radius:3px"></div><div class="hex" style="text-align:center">32</div></div></div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
