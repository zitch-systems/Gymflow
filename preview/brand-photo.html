<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../gymflow.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:22px; background:var(--gf-bg); color:var(--gf-text); font-family:var(--gf-font-body); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .nm { font-family:var(--gf-font-display); font-weight:700; font-size:12.5px; margin-top:7px; }
  .hex { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); margin-top:2px; }
  .cap { font-family:var(--gf-font-mono); font-size:11px; color:var(--gf-text-muted); }
  
</style>
</head>
<body>
<div class="row" style="gap:10px"><img src="../assets/gym-kettlebells.jpg" style="width:120px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--gf-border)" /><img src="../assets/gym-bikes.jpg" style="width:120px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--gf-border)" /><img src="../assets/gym-barbell.jpg" style="width:120px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--gf-border)" /><img src="../assets/gym-machines.jpg" style="width:120px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--gf-border)" /></div>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
