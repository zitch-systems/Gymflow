<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080e1c">
<title>Super Admin — GymFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gymflow.css">
<link rel="stylesheet" href="/tailwind_built.css">
<link rel="stylesheet" href="/gymflow-extra.css">
<script>(function(){var t=localStorage.getItem('gf-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
<style>
.platform-tag{display:inline-flex;align-items:center;padding:3px 12px;background:var(--gf-brand-soft);border:1px solid rgba(0,200,150,.2);border-radius:var(--gf-radius-pill);font-size:.75rem;font-weight:700;color:var(--gf-brand);letter-spacing:.04em}
.gym-row{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--gf-border);gap:14px;cursor:pointer;transition:background var(--gf-t)}
.gym-row:hover{background:var(--gf-elevated)}
.gym-row:last-child{border-bottom:none}
</style>
<!-- Supabase: CDN library + self-bootstrapping client (loads in order) -->
<script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/error-tracker.js" defer></script>
</head>
<body style="background:var(--gf-bg);min-height:100vh">
<div id="pageLoader" class="gf-page-loader"><div class="loader-logo">Gym<em>Flow</em></div><div class="loader-bar"><div class="loader-bar-fill"></div></div></div>

<header style="position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(8,14,28,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--gf-border)">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="/" style="font-family:var(--gf-font-display);font-size:1.125rem;font-weight:800;color:var(--gf-text);text-decoration:none">Gym<em style="font-style:normal;color:var(--gf-brand)">Flow</em></a>
    <span class="platform-tag">PLATFORM ADMIN</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="admin-email" style="font-size:.8125rem;color:var(--gf-text-muted)"></span>
    <button class="gf-btn gf-btn-ghost gf-btn-sm" id="logout-btn">Sign out</button>
  </div>
</header>

<div style="max-width:1100px;margin:0 auto;padding:32px 24px">
  <div id="error-box" class="gf-alert gf-alert-danger hidden" style="margin-bottom:20px"></div>

  <!-- Stats -->
  <div class="gf-grid-4" style="gap:16px;margin-bottom:32px">
    <div class="gf-card gf-card-stat"><div class="gf-stat-label">Total Gyms</div><div class="gf-stat-value" id="stat-gyms">—</div></div>
    <div class="gf-card gf-card-stat"><div class="gf-stat-label">Total Members</div><div class="gf-stat-value" id="stat-members">—</div></div>
    <div class="gf-card gf-card-stat"><div class="gf-stat-label">Active Subscriptions</div><div class="gf-stat-value" id="stat-subs">—</div></div>
    <div class="gf-card gf-card-stat"><div class="gf-stat-label">Check-ins Today</div><div class="gf-stat-value" id="stat-checkins">—</div></div>
  </div>

  <!-- Gyms -->
  <div class="gf-card" style="overflow:hidden;margin-bottom:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--gf-border)">
      <h2 style="font-size:1rem;font-weight:700">All Gyms</h2>
      <input type="text" id="gym-search" class="gf-input" placeholder="Search gyms…" style="width:200px" oninput="filterGyms(this.value)">
    </div>
    <div id="gyms-loading" style="padding:32px;text-align:center;color:var(--gf-text-muted)">Loading…</div>
    <div id="gyms-list" style="display:none"></div>
  </div>

  <!-- Recent members -->
  <div class="gf-card" style="overflow:hidden">
    <div style="padding:18px 20px;border-bottom:1px solid var(--gf-border)"><h2 style="font-size:1rem;font-weight:700">Recent Sign-ups</h2></div>
    <div id="recent-list" style="padding:8px 0"></div>
  </div>
</div>

<script type="module">
import { client, getUser, toast } from '/js/supabase.js';

let allGyms = [];

async function init() {
  const user = await getUser();
  if (!user) { window.location.href = '/login.html'; return; }
  const { data: profile } = await client.from('profiles').select('role').eq('user_id', user.id).limit(1).single();
  if (profile?.role !== 'platform_admin') { toast('Access denied', 'error'); setTimeout(() => { window.location.href = '/login.html'; }, 2000); return; }
  document.getElementById('admin-email').textContent = user.email;
  await Promise.all([loadStats(), loadGyms(), loadRecent()]);
  document.getElementById('pageLoader').classList.add('hidden');
}

async function loadStats() {
  const [g, m, s] = await Promise.all([
    client.from('gyms').select('*', { count: 'exact', head: true }),
    client.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'member'),
    client.from('member_subscriptions').select('*', { count: 'exact', head: true }).eq('status', 'active'),
  ]);
  const today = new Date().toISOString().split('T')[0];
  const { count: ci } = await client.from('check_ins').select('*', { count: 'exact', head: true }).gte('checked_in_at', today);
  document.getElementById('stat-gyms').textContent = (g.count||0).toLocaleString();
  document.getElementById('stat-members').textContent = (m.count||0).toLocaleString();
  document.getElementById('stat-subs').textContent = (s.count||0).toLocaleString();
  document.getElementById('stat-checkins').textContent = (ci||0).toLocaleString();
}

async function loadGyms() {
  const { data } = await client.from('gyms').select('*, profiles(count)').order('created_at', { ascending: false });
  document.getElementById('gyms-loading').style.display = 'none';
  allGyms = data || [];
  renderGyms(allGyms);
}

function renderGyms(gyms) {
  const list = document.getElementById('gyms-list');
  list.style.display = 'block';
  if (!gyms.length) { list.innerHTML = '<div class="gf-empty"><p style="color:var(--gf-text-muted)">No gyms found</p></div>'; return; }
  list.innerHTML = gyms.map(g => `
    <div class="gym-row" onclick="window.location='/admin-dashboard.html?gym=${g.slug}'">
      <div class="gf-avatar gf-avatar-md" style="background:var(--gf-brand-soft);color:var(--gf-brand);flex-shrink:0">${(g.name||'?')[0].toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:.9375rem">${g.name}</div>
        <div style="font-size:.75rem;color:var(--gf-text-muted)">${g.city||''}${g.state?', '+g.state:''} · ${g.slug}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span style="font-size:.8125rem;color:var(--gf-text-muted)">${g.profiles?.[0]?.count||0} members</span>
        <span class="gf-badge ${g.is_active!==false?'gf-badge-active':'gf-badge-expired'}">${g.is_active!==false?'Active':'Inactive'}</span>
      </div>
    </div>
  `).join('');
}

window.filterGyms = q => renderGyms(allGyms.filter(g => g.name.toLowerCase().includes(q.toLowerCase()) || g.slug.toLowerCase().includes(q.toLowerCase())));

async function loadRecent() {
  const { data } = await client.from('profiles').select('full_name,email,created_at,gyms(name)').order('created_at', { ascending: false }).limit(8);
  const el = document.getElementById('recent-list');
  if (!data?.length) { el.innerHTML = '<p style="padding:24px;color:var(--gf-text-muted);text-align:center">No sign-ups yet</p>'; return; }
  el.innerHTML = data.map(m => `
    <div class="gym-row">
      <div class="gf-avatar gf-avatar-sm" style="background:var(--gf-brand-soft);color:var(--gf-brand);flex-shrink:0">${(m.full_name||m.email||'?')[0].toUpperCase()}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:500;font-size:.875rem">${m.full_name||m.email}</div><div style="font-size:.75rem;color:var(--gf-text-muted)">${m.gyms?.name||'No gym'}</div></div>
      <div style="font-size:.75rem;color:var(--gf-text-muted)">${new Date(m.created_at).toLocaleDateString('en-NG',{day:'numeric',month:'short'})}</div>
    </div>
  `).join('');
}

document.getElementById('logout-btn').addEventListener('click', async () => { await client.auth.signOut(); window.location.href='/login.html'; });
init();
</script>
<script src="/gf-utils.js"></script>
</body>
</html>
