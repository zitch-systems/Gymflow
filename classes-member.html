<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080e1c">
<title>Book a Class — GymFlow</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gymflow.css">
<link rel="stylesheet" href="/tailwind_built.css">
<link rel="stylesheet" href="/gymflow-extra.css">
<script>
// Theme init — before render to prevent flash
(function(){var t=localStorage.getItem('gf-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>
<!-- Supabase: CDN library + self-bootstrapping client (loads in order) -->
<script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/error-tracker.js" defer></script>
</head>

<body class="min-h-screen antialiased">

<div id="pageLoader" class="gf-page-loader">
  <div class="loader-logo">Gym<em>Flow</em></div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<div id="app" class="gf-animate-fade">
  <aside class="sidebar gf-glass" id="sidebar">
    <div class="logo">GymFlow</div>
    <nav>
      <a href="/member-dashboard.html">Dashboard</a>
      <a href="/classes-member.html" class="active">Book a Class</a>
      <a href="/checkin.html">Check-In</a>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">🌓</button>
      <button type="button" class="logout" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar gf-glass">
      <button type="button" class="menu-btn" id="menuBtn">☰</button>
      <h1>Book a Class</h1>
    </header>
    <nav class="gf-breadcrumb"><a href="index.html" class="gf-breadcrumb-link">Index</a><span class="gf-breadcrumb-sep">/</span><a href="login.html" class="gf-breadcrumb-link">Login</a><span class="gf-breadcrumb-sep">/</span><a href="member-dashboard.html" class="gf-breadcrumb-link">Member Dashboard</a><span class="gf-breadcrumb-sep">/</span><span class="gf-breadcrumb-current">Classes Member</span></nav>

    <div class="content">
      <!-- My Bookings -->
      <div class="my-bookings gf-glass" id="myBookingsSection">
        <h3>📅 My Upcoming Bookings</h3>
        <div id="myBookingsList"></div>
      </div>

      <!-- Date picker -->
      <div class="date-picker">
        <label style="font-weight:500;">Select date:</label>
        <input type="date" id="bookingDate" min="" aria-label="Input field">
        <span style="color:var(--gf-text-muted); font-size:0.85rem;">Showing classes for selected date</span>
      </div>

      <!-- Classes by day -->
      <div id="classesContainer"></div>

      <div id="emptyState" class="empty-state" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:64px; height:64px; margin-bottom:16px; opacity:0.4;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <h3>No classes available</h3>
        <p>Check back later for new class schedules.</p>
      </div>
    </div>
  </main>
</div>

<script type="module">
'use strict';

import { client, getGymSlug, loadGym, getUser, requireMember, toast } from '/js/supabase.js';

let gym = null;
let user = null;
let classesData = [];
let myBookings = [];
let selectedDate = new Date().toISOString().split('T')[0];

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

async function init() {
    try {
  user = await requireMember();
  if (!user) return;

  gym = await loadGym();
  if (!gym) { toast('Gym not found', 'error'); return; }

  // Set date picker default and min
  const dateInput = document.getElementById('bookingDate');
  dateInput.value = selectedDate;
  dateInput.min = selectedDate;
  dateInput.addEventListener('change', (e) => {
    selectedDate = e.target.value;
    loadData();
  });

  await loadData();
  setupListeners();

  } catch(err) { console.error('Init error:', err); if(window.toast) toast(err.message||'Failed to load','error'); }
}

async function loadData() {
  await Promise.all([loadClasses(), loadMyBookings()]);
  render();
}

async function loadClasses() {
  const { data, error } = await client.from('classes')
    .select('*')
    .eq('gym_id', gym.id)
    .eq('is_active', true)
    .order('day_of_week', { ascending: true })
    .order('start_time', { ascending: true });

  if (error) { toast('Failed to load classes', 'error'); return; }
  classesData = data || [];
}

async function loadMyBookings() {
  const { data, error } = await client.from('class_bookings')
    .select('*, classes(name, start_time, end_time, day_of_week)')
    .eq('gym_id', gym.id)
    .eq('member_id', user.id)
    .eq('status', 'booked')
    .gte('booking_date', new Date().toISOString().split('T')[0])
    .order('booking_date', { ascending: true });

  if (error) { toast('Failed to load bookings', 'error'); return; }
  myBookings = data || [];
}

async function getBookingCount(classId, date) {
  const { count, error } = await client.from('class_bookings')
    .select('*', { count: 'exact', head: true })
    .eq('gym_id', gym.id)
    .eq('class_id', classId)
    .eq('booking_date', date)
    .eq('status', 'booked');

  if (error) return 0;
  return count || 0;
}

function render() {
  renderMyBookings();
  renderClasses();
}

function renderMyBookings() {
  const container = document.getElementById('myBookingsList');
  if (myBookings.length === 0) {
    container.innerHTML = '<p style="color:var(--gf-text-muted); font-size:0.9rem;">No upcoming bookings.</p>';
    return;
  }

  container.innerHTML = myBookings.map(b => `
    <div class="booking-chip">
      <span>${escapeHtml(b.classes?.name || 'Class')} · ${formatDate(b.booking_date)} · ${formatTime(b.classes?.start_time)}</span>
      <span class="cancel" data-action="cancelMyBooking" data-args="'${b.id}'">×</span>
    </div>
  `).join('');
}

async function renderClasses() {
  const container = document.getElementById('classesContainer');
  const empty = document.getElementById('emptyState');

  // Filter classes by selected date's day
  const dayName = DAYS[new Date(selectedDate).getDay()];
  const dayClasses = classesData.filter(c => c.day_of_week === dayName);

  if (dayClasses.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  // Get booking counts
  const counts = await Promise.all(
    dayClasses.map(c => getBookingCount(c.id, selectedDate))
  );

  // Check which classes user has already booked for this date
  const myClassIds = myBookings
    .filter(b => b.booking_date === selectedDate)
    .map(b => b.class_id);

  container.innerHTML = `
    <div class="day-section">
      <div class="day-header">${dayName} · ${formatDate(selectedDate)}</div>
      ${dayClasses.map((cls, i) => {
        const count = counts[i];
        const isFull = count >= cls.max_capacity;
        const isBooked = myClassIds.includes(cls.id);
        const spotsLeft = cls.max_capacity - count;

        return `
          <div class="class-row ${isBooked ? 'booked' : ''} ${isFull ? 'full' : ''}">
            <div class="time-block">
              <div class="time">${formatTime(cls.start_time)}</div>
              <div class="ampm">${formatTime(cls.end_time)}</div>
            </div>
            <div class="info">
              <div class="name">${escapeHtml(cls.name)}</div>
              <div class="meta">${escapeHtml(cls.instructor)} · ${cls.description || ''}</div>
            </div>
            <div class="capacity">
              <div class="num" style="color:${isFull ? 'var(--gf-danger)' : (spotsLeft <= 3 ? 'var(--gf-warning)' : 'var(--gf-primary)')};">${spotsLeft}</div>
              <div class="label">spots left</div>
            </div>
            <div class="action">
              ${isBooked ? `
                <button type="button" class="btn btn-sm btn-secondary" data-action="cancelMyBookingByClass" data-args="'${cls.id}'">Cancel</button>
              ` : isFull ? `
                <button type="button" class="btn btn-sm gf-tooltip" disabled>Full</button>
              ` : `
                <button type="button" class="btn btn-sm btn-primary" data-action="bookClass" data-args="'${cls.id}'">Book Now</button>
              `}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

window.bookClass = async function(classId) {
  const btn = document.querySelector(`button[data-action="bookClass" data-args="'${classId}'"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Booking...'; }

  const { data: existing, error: checkErr } = await client.from('class_bookings')
    .select('id')
    .eq('gym_id', gym.id)
    .eq('class_id', classId)
    .eq('member_id', user.id)
    .eq('booking_date', selectedDate)
    .eq('status', 'booked')
    .single();

  if (existing) {
    toast('Already booked for this date', 'warning');
    if (btn) { btn.disabled = false; btn.textContent = 'Book Now'; }
    return;
  }

  const { error } = await client.from('class_bookings')
    .insert({
      gym_id: gym.id,
      class_id: classId,
      member_id: user.id,
      booking_date: selectedDate,
      status: 'booked',
    })
    .select().single();

  if (error) {
    toast(error.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Book Now'; }
    return;
  }

  toast('Class booked!', 'success');
  await loadData();
};

window.cancelMyBooking = async function(bookingId) {
  if (!confirm('Cancel this booking?')) return;

  const { error } = await client.from('class_bookings')
    .update({ status: 'cancelled' })
    .eq('id', bookingId)
    .eq('member_id', user.id)
    .eq('gym_id', gym.id).select().single();

  if (error) { toast(error.message, 'error'); return; }
  toast('Booking cancelled', 'success');
  await loadData();
};

window.cancelMyBookingByClass = async function(classId) {
  const booking = myBookings.find(b => b.class_id === classId && b.booking_date === selectedDate);
  if (booking) await cancelMyBooking(booking.id);
};

function formatTime(t) {
  if (!t) return '--:--';
  const [h, m] = t.split(':');
  const hr = parseInt(h);
  const ampm = hr >= 12 ? 'PM' : 'AM';
  const displayHr = hr % 12 || 12;
  return `${displayHr}:${m} ${ampm}`;
}

function formatDate(d) {
  const date = new Date(d + 'T00:00:00');
  return date.toLocaleDateString('en-NG', { weekday: 'short', month: 'short', day: 'numeric' });
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function setupListeners() {
  document.getElementById('themeToggle').addEventListener('click', () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('gf-theme', next);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.href = '/login.html';
  });

  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
}

init();
</script>

  

<script src="/gf-utils.js"></script>
</body>
</html>
