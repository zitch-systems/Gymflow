<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080e1c">
<title>Class Schedule — GymFlow</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gymflow.css">
<link rel="stylesheet" href="/tailwind_built.css">
<link rel="stylesheet" href="/gymflow-extra.css">
<script>
// Theme init — before render to prevent flash
(function(){var t=localStorage.getItem('gf-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>
<!-- Supabase: CDN library + self-bootstrapping client (loads in order) -->
<script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
</head>

<body class="min-h-screen antialiased">

<div id="pageLoader" class="gf-page-loader">
  <div class="loader-logo">Gym<em>Flow</em></div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<div id="app" class="gf-animate-fade">
  <aside class="sidebar gf-glass" id="sidebar">
    <div class="logo">GymFlow</div>
    <nav>
      <a href="/admin-dashboard.html">Dashboard</a>
      <a href="/checkin.html">Check-In</a>
      <a href="/staff-checkin.html">Staff Scanner</a>
      <a href="/reminders.html">Reminders</a>
      <a href="/classes-admin.html" class="active">Classes</a>
      <a href="/member-dashboard.html">My Profile</a>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">🌓</button>
      <button type="button" class="logout" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar gf-glass">
      <button type="button" class="menu-btn" id="menuBtn">☰</button>
      <h1>Class Schedule</h1>
      <div class="topbar-actions">
        <span id="userRole" class="role-badge"></span>
        <button type="button" class="btn btn-primary" id="addClassBtn">+ New Class</button>
      </div>
    </header>
    <nav class="gf-breadcrumb"><a href="index.html" class="gf-breadcrumb-link">Index</a><span class="gf-breadcrumb-sep">/</span><a href="login.html" class="gf-breadcrumb-link">Login</a><span class="gf-breadcrumb-sep">/</span><a href="admin-dashboard.html" class="gf-breadcrumb-link">Admin Dashboard</a><span class="gf-breadcrumb-sep">/</span><a href="analytics.html" class="gf-breadcrumb-link">Analytics</a><span class="gf-breadcrumb-sep">/</span><a href="operations.html" class="gf-breadcrumb-link">Operations</a><span class="gf-breadcrumb-sep">/</span><span class="gf-breadcrumb-current">Classes Admin</span></nav>

    <div class="content">
      <!-- Day tabs -->
      <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px;">
        <div class="day-tab active" data-day="all">All Days</div>
        <div class="day-tab gf-focus" data-day="Monday">Mon</div>
        <div class="day-tab gf-focus" data-day="Tuesday">Tue</div>
        <div class="day-tab gf-focus" data-day="Wednesday">Wed</div>
        <div class="day-tab gf-focus" data-day="Thursday">Thu</div>
        <div class="day-tab gf-focus" data-day="Friday">Fri</div>
        <div class="day-tab gf-focus" data-day="Saturday">Sat</div>
        <div class="day-tab gf-focus" data-day="Sunday">Sun</div>
      </div>

      <!-- Classes grid -->
      <div id="classesGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;"></div>

      <!-- Empty state -->
      <div id="emptyState" class="empty-state" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <h3>No classes scheduled</h3>
        <p>Add your first class to get started.</p>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Class Modal -->
<div class="gf-modal-bg" id="classModal">
  <div class="modal">
    <h2 id="modalTitle">New Class</h2>
    <form id="classForm">
      <input type="hidden" id="classId" aria-label="Input field">
      <div class="form-grid">
        <div class="full">
          <label>Class Name *</label>
          <input aria-label="Input field" type="text" id="cName" required placeholder="e.g. HIIT Blast">
        </div>
        <div class="full">
          <label>Description</label>
          <textarea id="cDesc" rows="2" placeholder="Brief description..."></textarea>
        </div>
        <div>
          <label>Instructor *</label>
          <input aria-label="Input field" type="text" id="cInstructor" required placeholder="Trainer name">
        </div>
        <div>
          <label>Day *</label>
          <select id="cDay" required>
            <option value="">Select day</option>
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div>
          <label>Start Time *</label>
          <input type="time" id="cStart" required aria-label="Input field">
        </div>
        <div>
          <label>End Time *</label>
          <input type="time" id="cEnd" required aria-label="Input field">
        </div>
        <div>
          <label>Max Capacity *</label>
          <input type="number" id="cCapacity" required min="1" max="100" value="20" aria-label="Input field">
        </div>
        <div style="display:flex; align-items:flex-end;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="cActive" checked aria-label="Input field">
            <span>Active</span>
          </label>
        </div>
      </div>
      <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:20px;">
        <button type="button" class="btn" id="cancelClass">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Class</button>
      </div>
    </form>
  </div>
</div>

<!-- Bookings Modal -->
<div class="gf-modal-bg" id="bookingsModal">
  <div class="modal" style="max-width: 600px;">
    <h2 id="bookingsTitle">Bookings</h2>
    <div id="bookingsList" style="max-height: 60vh; overflow-y: auto;"></div>
    <div style="display:flex; justify-content:flex-end; margin-top:16px;">
      <button type="button" class="btn" id="closeBookings">Close</button>
    </div>
  </div>
</div>

<script type="module">
'use strict';

import { client, getGymSlug, loadGym, getUser, requireAuth, getStaffRole, toast } from '/js/supabase.js';

let gym = null;
let user = null;
let staffRole = null;
let classesData = [];
let currentFilter = 'all';

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

async function init() {
    try {
  user = await requireAuth();
  if (!user) return;

  gym = await loadGym();
  if (!gym) { toast('Gym not found', 'error'); return; }

  staffRole = await getStaffRole(gym.id);
  if (!staffRole) {
    toast('Staff access required', 'error');
    setTimeout(() => window.location.href = '/member-dashboard.html', 1500);
    return;
  }

  document.getElementById('userRole').textContent = staffRole;

  // Role-based UI
  if (staffRole === 'rep') {
    document.getElementById('addClassBtn').style.display = 'none';
  }

  await loadClasses();
  setupListeners();

  } catch(err) { console.error('Init error:', err); if(window.toast) toast(err.message||'Failed to load','error'); }
}

async function loadClasses() {
  const { data, error } = await client.from('classes')
    .select('*')
    .eq('gym_id', gym.id)
    .order('day_of_week', { ascending: true })
    .order('start_time', { ascending: true });

  if (error) { toast('Failed to load classes: ' + error.message, 'error'); return; }

  classesData = data || [];
  renderClasses();
}

async function getBookingCount(classId, bookingDate) {
  const today = bookingDate || new Date().toISOString().split('T')[0];
  const { count, error } = await client.from('class_bookings')
    .select('*', { count: 'exact', head: true })
    .eq('gym_id', gym.id)
    .eq('class_id', classId)
    .eq('booking_date', today)
    .eq('status', 'booked');

  if (error) return 0;
  return count || 0;
}

async function renderClasses() {
  const grid = document.getElementById('classesGrid');
  const empty = document.getElementById('emptyState');

  let filtered = classesData;
  if (currentFilter !== 'all') {
    filtered = classesData.filter(c => c.day_of_week === currentFilter);
  }

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  // Get booking counts for all visible classes
  const counts = await Promise.all(
    filtered.map(c => getBookingCount(c.id))
  );

  grid.innerHTML = filtered.map((cls, i) => {
    const count = counts[i];
    const pct = Math.min((count / cls.max_capacity) * 100, 100);
    const isFull = count >= cls.max_capacity;
    const statusColor = isFull ? 'var(--gf-danger)' : (pct > 80 ? 'var(--gf-warning)' : 'var(--gf-primary)');

    return `
      <div class="class-card gf-lift" data-id="${cls.id}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div>
            <div class="class-time">${formatTime(cls.start_time)} – ${formatTime(cls.end_time)}</div>
            <div style="font-weight:600; font-size:1.05rem; margin-top:4px;">${escapeHtml(cls.name)}</div>
          </div>
          <span style="font-size:0.75rem; padding:2px 8px; border-radius:10px; background:${cls.is_active ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)'}; color:${cls.is_active ? '#22c55e' : '#ef4444'};">
            ${cls.is_active ? 'Active' : 'Inactive'}
          </span>
        </div>
        <div class="class-meta">${escapeHtml(cls.instructor)} · ${cls.day_of_week}</div>
        ${cls.description ? `<div class="class-meta">${escapeHtml(cls.description)}</div>` : ''}
        <div style="margin-top:12px;">
          <div class="capacity-bar">
            <div class="capacity-fill" style="width:${pct}%; background:${statusColor};"></div>
          </div>
          <div class="capacity-text">${count} / ${cls.max_capacity} booked ${isFull ? '· FULL' : ''}</div>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="button" class="btn btn-sm gf-tooltip" data-action="viewBookings" data-args="'${cls.id}', '${escapeHtml(cls.name)}'">View Bookings</button>
          ${staffRole !== 'rep' ? `
            <button type="button" class="btn btn-sm btn-secondary" data-action="editClass" data-args="'${cls.id}'">Edit</button>
            <button type="button" class="btn btn-sm gf-tooltip" style="background:var(--gf-danger); color:#fff;" data-action="deleteClass" data-args="'${cls.id}'">Delete</button>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function formatTime(t) {
  if (!t) return '--:--';
  const [h, m] = t.split(':');
  const hr = parseInt(h);
  const ampm = hr >= 12 ? 'PM' : 'AM';
  const displayHr = hr % 12 || 12;
  return `${displayHr}:${m} ${ampm}`;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

window.viewBookings = async function(classId, className) {
  const today = new Date().toISOString().split('T')[0];
  const { data: bookings, error } = await client.from('class_bookings')
    .select('*, profiles(full_name, phone)')
    .eq('gym_id', gym.id)
    .eq('class_id', classId)
    .eq('booking_date', today)
    .order('created_at', { ascending: false });

  if (error) { toast('Failed to load bookings', 'error'); return; }

  document.getElementById('bookingsTitle').textContent = `Bookings: ${className} (${today})`;
  const list = document.getElementById('bookingsList');

  if (!bookings || bookings.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>No bookings for today.</p></div>';
  } else {
    list.innerHTML = bookings.map(b => `
      <div class="booking-row">
        <div class="member-name">${escapeHtml(b.profiles?.full_name || 'Unknown')}</div>
        <div class="class-meta">${b.profiles?.phone || ''}</div>
        <span class="status status-${b.status}">${b.status}</span>
        ${staffRole !== 'rep' && b.status === 'booked' ? `
          <button type="button" class="btn btn-sm gf-tooltip" data-action="markAttended" data-args="'${b.id}'">Mark Attended</button>
          <button type="button" class="btn btn-sm gf-tooltip" style="background:var(--gf-danger); color:#fff;" data-action="cancelBooking" data-args="'${b.id}'">Cancel</button>
        ` : ''}
      </div>
    `).join('');
  }

  document.getElementById('bookingsModal').classList.add('open');
};

window.markAttended = async function(bookingId) {
  const { error } = await client.from('class_bookings')
    .update({ status: 'attended' })
    .eq('id', bookingId)
    .eq('gym_id', gym.id).select().single();

  if (error) { toast(error.message, 'error'); return; }
  toast('Marked as attended', 'success');
  // Refresh bookings view
  const activeCard = document.querySelector('.class-card:hover');
  if (activeCard) {
    const cid = activeCard.dataset.id;
    const cname = activeCard.querySelector('.class-time').nextElementSibling.textContent;
    await viewBookings(cid, cname);
  }
};

window.cancelBooking = async function(bookingId) {
  if (!confirm('Cancel this booking?')) return;
  const { error } = await client.from('class_bookings')
    .update({ status: 'cancelled' })
    .eq('id', bookingId)
    .eq('gym_id', gym.id).select().single();

  if (error) { toast(error.message, 'error'); return; }
  toast('Booking cancelled', 'success');
};

window.editClass = async function(classId) {
  const cls = classesData.find(c => c.id === classId);
  if (!cls) return;

  document.getElementById('modalTitle').textContent = 'Edit Class';
  document.getElementById('classId').value = cls.id;
  document.getElementById('cName').value = cls.name;
  document.getElementById('cDesc').value = cls.description || '';
  document.getElementById('cInstructor').value = cls.instructor;
  document.getElementById('cDay').value = cls.day_of_week;
  document.getElementById('cStart').value = cls.start_time;
  document.getElementById('cEnd').value = cls.end_time;
  document.getElementById('cCapacity').value = cls.max_capacity;
  document.getElementById('cActive').checked = cls.is_active;

  document.getElementById('classModal').classList.add('open');
};

window.deleteClass = async function(classId) {
  if (!confirm('Delete this class? All bookings will be lost.')) return;

  const { error } = await client.from('classes')
    .delete()
    .eq('id', classId)
    .eq('gym_id', gym.id);

  if (error) { toast(error.message, 'error'); return; }
  toast('Class deleted', 'success');
  await loadClasses();
};

function setupListeners() {
  // Day tabs
  document.querySelectorAll('.day-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.day;
      renderClasses();
    });
  });

  // Add class button
  document.getElementById('addClassBtn').addEventListener('click', () => {
    document.getElementById('modalTitle').textContent = 'New Class';
    document.getElementById('classForm').reset();
    document.getElementById('classId').value = '';
    document.getElementById('cActive').checked = true;
    document.getElementById('classModal').classList.add('open');
  });

  // Cancel buttons
  document.getElementById('cancelClass').addEventListener('click', () => {
    document.getElementById('classModal').classList.remove('open');
  });
  document.getElementById('closeBookings').addEventListener('click', () => {
    document.getElementById('bookingsModal').classList.remove('open');
  });

  // Close modals on overlay click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });
  });

  // Form submit
  document.getElementById('classForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const id = document.getElementById('classId').value;
    const payload = {
      gym_id: gym.id,
      name: document.getElementById('cName').value.trim(),
      description: document.getElementById('cDesc').value.trim() || null,
      instructor: document.getElementById('cInstructor').value.trim(),
      day_of_week: document.getElementById('cDay').value,
      start_time: document.getElementById('cStart').value,
      end_time: document.getElementById('cEnd').value,
      max_capacity: parseInt(document.getElementById('cCapacity').value),
      is_active: document.getElementById('cActive').checked,
    };

    let error;
    if (id) {
      const { error: err } = await client.from('classes')
        .update(payload)
        .eq('id', id)
        .eq('gym_id', gym.id)
        .select().single();
      error = err;
    } else {
      const { error: err } = await client.from('classes')
        .insert(payload)
        .select().single();
      error = err;
    }

    btn.disabled = false;
    btn.textContent = 'Save Class';

    if (error) { toast(error.message, 'error'); return; }

    toast(id ? 'Class updated' : 'Class created', 'success');
    document.getElementById('classModal').classList.remove('open');
    await loadClasses();
  });

  // Theme toggle
  document.getElementById('themeToggle').addEventListener('click', () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('gf-theme', next);
  });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.href = '/login.html';
  });

  // Mobile menu
  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
}

// Init
init();
</script>

  

<script src="/gf-utils.js"></script>
</body>
</html>
